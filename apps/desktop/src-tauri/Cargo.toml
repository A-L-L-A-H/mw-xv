[package]
name = "moonwitness-desktop"
version = "1.0.0-rc.1"
description = "Hardened Tauri v2 native shell for MoonWitness Desktop local-first agent harness"
authors = ["MoonWitness Engineering"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
