[package]
name = "moonwitness-isp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "ISP & RADIUS authentication server for MoonWitness"
license = "AGPL-3.0-only"
repository = "https://github.com/A-L-L-A-H/mw-xv"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.6", features = ["derive"] }
config = { version = "0.15", default-features = true, features = ["toml"] }
radius = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json", "migrate"] }
tokio = { version = "1.54", features = ["rt", "macros", "net", "signal", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true