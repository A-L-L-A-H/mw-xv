# MoonWitness ISP & RADIUS server (SQLite edge runtime).
# Build context is the repository root so the Dockerfile can COPY apps/isp sources.
services:
  isp:
    build:
      context: ../..
      dockerfile: apps/isp/Dockerfile
    container_name: moonwitness-isp
    ports:
      - '1812:1812/udp'
      - '1813:1813/udp'
      - '3000:3000'
    environment:
      # SQLite database file location (created and migrated on startup).
      - MW_ISP_DB_PATH=/data/isp.db
      # Admin API bearer token. Unset in production deployments so the binary
      # derives it from MW_INTERNAL_SECRET/JWT_SECRET; set here only for local runs.
      - MW_ISP_ADMIN_TOKEN=${MW_ISP_ADMIN_TOKEN:-local-admin-token}
      - RUST_LOG=info
    # CLI flags: RADIUS auth 1812/udp, accounting 1813/udp, HTTP admin API on 3000.
    command:
      [
        './moonwitness-isp',
        '--radius-addr',
        '0.0.0.0:1812',
        '--acct-addr',
        '0.0.0.0:1813',
        '--http-addr',
        '0.0.0.0:3000',
      ]
    volumes:
      - isp_data:/data
    restart: unless-stopped

volumes:
  isp_data:
