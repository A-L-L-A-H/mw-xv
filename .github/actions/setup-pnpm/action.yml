name: Setup MoonWitness Node workspace
description: Install the pinned Node/pnpm toolchain using GitHub-owned actions only.
inputs:
  node-version:
    description: Node.js major/minor configured for CI
    required: false
    default: '22'
  pnpm-version:
    description: Exact pnpm version pinned by the workspace
    required: false
    default: '11.17.0'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install pinned pnpm CLI
      shell: bash
      run: npm install --global --no-audit --no-fund "pnpm@${{ inputs.pnpm-version }}"
