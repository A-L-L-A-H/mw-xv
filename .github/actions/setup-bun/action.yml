name: Setup MoonWitness Node workspace
description: Install the pinned Node/Bun toolchain using GitHub-owned actions only.
inputs:
  node-version:
    description: Node.js major/minor configured for CI
    required: false
    default: '24'
  bun-version:
    description: Exact Bun version pinned by the workspace
    required: false
    default: '1.4.5'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: ~/.bun/install/cache
        key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-cache-${{ runner.os }}-
