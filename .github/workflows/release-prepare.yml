name: Prepare release candidate

on:
  workflow_dispatch:
    inputs:
      expected_dev_sha:
        description: Full dev SHA to prepare from; this prevents a stale release write
        required: true
        type: string
      channel:
        description: Release channel to prepare
        required: true
        type: choice
        options:
          - rc
          - stable
          - hotfix
        default: rc

permissions:
  contents: read

concurrency:
  group: release-prepare-dev
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    concurrency:
      group: dev-branch-updates
      cancel-in-progress: false
    steps:
      - name: Validate requested source SHA
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_dev_sha }}
          ACTUAL_SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$ACTUAL_SOURCE_SHA"
      - name: Create disposable release preparation checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_dev_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: ./.github/actions/setup-bun
        with:
          node-version: '24'
          bun-version: '1.3.4'
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify checkout and prepare release files
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_dev_sha }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_SOURCE_SHA"
          bun run release:prepare -- --expected-head "$EXPECTED_SOURCE_SHA" --channel "$RELEASE_CHANNEL" --apply
      - name: Commit and push prepared release atomically
        id: publish
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_dev_sha }}
        run: |
          if git diff --quiet; then
            echo "No release preparation changes are needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json bun.lock CHANGELOG.md
          while IFS= read -r -d '' file; do
            case "$file" in
              README.md|apps/*/package.json|packages/*/package.json|docs/*) git add -- "$file" ;;
              *) echo "Unexpected generated release path: $file" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only -z)
          if git diff --cached --quiet; then
            echo "No release preparation changes are staged."
            exit 0
          fi
          git commit -m "chore(release): prepare workspace release"
          node scripts/push-expected-ref.mjs origin HEAD refs/heads/dev "$EXPECTED_SOURCE_SHA"
          prepared_sha="$(git rev-parse HEAD)"
          [[ "$prepared_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "prepared_sha=$prepared_sha" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact-SHA CI and await the governance checks
        id: ci
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREPARED_SHA: ${{ steps.publish.outputs.prepared_sha }}
        run: |
          set -euo pipefail
          [[ "$PREPARED_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh workflow run ci.yml --repo "$GH_REPO" --ref dev
          node scripts/release-await-ci.mjs --sha "$PREPARED_SHA" --repo "$GH_REPO" \
            --checks '["ci-gate"]' --timeout-seconds 1800 --interval-seconds 30
      - name: Dispatch promotion after exact-SHA CI succeeds
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREPARED_SHA: ${{ steps.publish.outputs.prepared_sha }}
        run: |
          set -euo pipefail
          [[ "$PREPARED_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh workflow run promote.yml --repo "$GH_REPO" --ref dev -f expected_sha="$PREPARED_SHA"
          echo "Dispatched promotion for verified dev SHA $PREPARED_SHA." >> "$GITHUB_STEP_SUMMARY"
