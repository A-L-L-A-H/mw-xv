name: Fleet stop / recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: Pause the fleet or recover it with a new epoch
        required: true
        type: choice
        options:
          - pause
          - resume
        default: pause
      reason:
        description: Break-glass incident reason (at least 8 characters)
        required: true
        type: string
      confirm:
        description: Type STOP to authorize a pause (recovery does not require it)
        required: false
        type: string
      expect_epoch:
        description: Optional epoch that must still be current (compare-and-swap guard)
        required: false
        type: string
      dry_run:
        description: Compute the transition without writing state or cancelling runs
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fleet-break-glass
  cancel-in-progress: false

jobs:
  apply:
    name: fleet-break-glass
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: fleet-break-glass
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - name: Validate break-glass authorization
        env:
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_REASON: ${{ inputs.reason }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
          ACTOR: ${{ github.actor }}
          ALLOWED_ACTORS: ${{ vars.GOVERNANCE_BREAK_GLASS_ACTORS || 'bjo163' }}
        run: |
          set -euo pipefail
          [[ "$ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$ ]]
          if ! printf '%s\n' "$ALLOWED_ACTORS" | tr ',' '\n' | grep -Fxq "$ACTOR"; then
            echo "Actor $ACTOR is not an allowlisted break-glass owner." >&2
            exit 1
          fi
          [[ ${#INPUT_REASON} -ge 8 ]]
          if [[ "$INPUT_ACTION" == "pause" && "$INPUT_CONFIRM" != "STOP" ]]; then
            echo "Pausing the fleet requires confirm=STOP." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Require the dedicated break-glass identity
        env:
          BREAK_GLASS_TOKEN: ${{ secrets.FLEET_BREAK_GLASS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$BREAK_GLASS_TOKEN" ]]; then
            echo "FLEET_BREAK_GLASS_TOKEN is not configured; governance writes are disabled." >&2
            exit 1
          fi
      - name: Apply the durable fleet state transition
        env:
          GH_TOKEN: ${{ secrets.FLEET_BREAK_GLASS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_REASON: ${{ inputs.reason }}
          INPUT_EPOCH: ${{ inputs.expect_epoch || '' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--repo "$GH_REPO" --action "$INPUT_ACTION" --actor "$ACTOR" --reason "$INPUT_REASON")
          if [[ -n "$INPUT_EPOCH" ]]; then
            [[ "$INPUT_EPOCH" =~ ^[1-9][0-9]*$ ]]
            args+=(--expect-epoch "$INPUT_EPOCH")
          fi
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then args+=(--dry-run true); fi
          node scripts/fleet-stop.mjs apply "${args[@]}" | tee "$RUNNER_TEMP/fleet-result.json"
      - name: Record the break-glass action
        env:
          ACTOR: ${{ github.actor }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          {
            echo "### Fleet break-glass"
            echo "- Action: $INPUT_ACTION"
            echo "- Actor: $ACTOR"
            echo "- Durable state: \`refs/heads/governance/fleet-state\`"
            echo "- Every transition advances the epoch; credentials and leases from the previous epoch are invalid."
          } >> "$GITHUB_STEP_SUMMARY"
