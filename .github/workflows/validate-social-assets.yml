name: Validate social assets

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-social-assets-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-social-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          node-version: '24'
          bun-version: '1.4.5'
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Validate social SVG sources and completeness matrix
        run: node packages/assets/scripts/validate-social-assets.mjs --json --report packages/assets/brand/rendered/social-validation-report.json
      - name: Upload social asset validation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: social-validation-report-${{ github.sha }}
          path: packages/assets/brand/rendered/social-validation-report.json
          if-no-files-found: error
          retention-days: 7
