name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Verify workflow pins and roadmap contract
        run: |
          pnpm automation:check:action-pins
          pnpm automation:check:action-tags
          pnpm automation:check:roadmap
      - name: Verify shared UI, API addon boundary, assets, and documentation links
        run: |
          pnpm board:ui:check
          pnpm desktop:ui:check
          pnpm api:addon:check
          pnpm test:assets
          pnpm exec playwright install chromium
          pnpm assets:check:bounds
          pnpm test:ui
          node scripts/check-docs.mjs
      - name: Build workspace and verify budgets
        id: build-workspace
        run: |
          set -euo pipefail
          pnpm build
          pnpm orm:check:seeds
          pnpm --filter @moonwitness/desktop build
          pnpm --filter @moonwitness/desktop typecheck
          pnpm --filter @moonwitness/desktop test
          node scripts/docs/generate-reference.mjs
          node scripts/docs/update-readme.mjs
          echo "references_generated=true" >> "$GITHUB_OUTPUT"
          pnpm docs:check:built
          pnpm --filter @moonwitness/board typecheck
          pnpm board:budget
          pnpm test:ui-budget
          pnpm test:ui-catalog
          git diff --exit-code -- \
            README.md \
            docs/guide/reference/generated-api.md \
            docs/guide/reference/generated-models.md \
            docs/guide/reference/generated-platform.json \
            docs/guide/reference/generated-platform.md

      - name: Upload generated reference outputs for exact reconciliation
        if: always() && steps.build-workspace.outputs.references_generated == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: generated-docs-${{ github.sha }}
          path: |
            README.md
            docs/guide/reference/generated-api.md
            docs/guide/reference/generated-models.md
            docs/guide/reference/generated-platform.json
            docs/guide/reference/generated-platform.md
          if-no-files-found: error
          retention-days: 7

      - name: Emit generated docs for exact one-time reconciliation
        if: failure() && steps.build-workspace.outputs.references_generated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            README.md \
            docs/guide/reference/generated-api.md \
            docs/guide/reference/generated-models.md \
            docs/guide/reference/generated-platform.json \
            docs/guide/reference/generated-platform.md; do
            echo "GENERATED_DOC_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "GENERATED_DOC_END:$file"
          done

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Run TaskOS registry safety tests
        run: pnpm test:taskos
      - name: Build and run unit tests
        run: |
          pnpm build
          pnpm test:unit:built
      - name: Build and validate the one-time TaskOS recovery candidate
        id: taskos-recovery
        shell: bash
        run: |
          set -euo pipefail
          candidate_path="$RUNNER_TEMP/taskos-candidate-${GITHUB_SHA}.json"
          pnpm tasks:sweep
          pnpm tasks:sweep --candidate "$candidate_path"
          TASKOS_CANDIDATE="$candidate_path" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const registry = JSON.parse(await readFile(process.env.TASKOS_CANDIDATE, 'utf8'));
          assert.equal(registry.tasks.length, 627);
          const statusCounts = Object.fromEntries(
            ['done', 'doing', 'todo', 'blocked'].map((status) => [
              status,
              registry.tasks.filter((task) => task.status === status).length,
            ])
          );
          assert.deepEqual(statusCounts, { done: 468, doing: 49, todo: 89, blocked: 21 });
          console.log('Validated 627 isolated TaskOS candidate records; canonical registry was not changed.');
          NODE
          echo "candidate_generated=true" >> "$GITHUB_OUTPUT"
          echo "TASKOS_CANDIDATE_BEGIN"
          base64 -w0 "$candidate_path"
          echo
          echo "TASKOS_CANDIDATE_END"
      - name: Upload the source-validated TaskOS recovery candidate
        if: always() && steps.taskos-recovery.outputs.candidate_generated == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: taskos-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/taskos-candidate-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 7

  knowledge-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Build knowledge workspace dependencies
        run: pnpm --filter @moonwitness/orm-knowledge... build
      - name: Run K9-001 deterministic knowledge gate
        run: node scripts/knowledge/run-k-gate.mjs --json

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      REQUIRE_POSTGRES_TESTS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Build workspace and run PostgreSQL integration suites
        run: |
          pnpm build
          pnpm test:integration:built
          node scripts/knowledge/run-k-gate.mjs --json

  dx-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24'
          pnpm-version: '11.17.0'
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - name: Run moonwitness-dx full test suite (dx:test)
        run: pnpm dx:test
