name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          node-version: '24'
          bun-version: '1.4.5'
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Lint commit messages
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx --package @commitlint/cli --package @commitlint/config-conventional commitlint \
              --extends @commitlint/config-conventional \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to "${{ github.event.pull_request.head.sha }}"
          else
            bunx --package @commitlint/cli --package @commitlint/config-conventional commitlint \
              --extends @commitlint/config-conventional \
              --last
          fi

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          expected='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::gitleaks checksum mismatch: expected $expected, got $actual"
            exit 1
          fi
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --no-banner \
            --exit-code 1
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gitleaks-report-${{ github.sha }}
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          node-version: '24'
          bun-version: '1.4.5'
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies for critical advisories
        run: bun audit --audit-level critical

  quality-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          node-version: '24'
          bun-version: '1.4.5'
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify workflow pins and static boundaries
        run: |
          node scripts/ci/check-action-pins.mjs
          node scripts/ci/check-action-tag-pins.mjs
          node scripts/ci/check-gitleaks-config.mjs
          bun run board:ui:check
          bun run ui:design:check
          bun run lint:ui
          bun run api:addon:check
          bun run agent:boundary:check
          node scripts/ci/check-constitution.mjs
      - name: Enforce workspace quality ratchet
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "../scripts/quality.py" ]; then
            python3 ../scripts/quality.py --repo mw-xv --changed --strict
          else
            echo "Workspace ../scripts/quality.py not present in isolated runner; skipping."
          fi
      - name: Lint and typecheck
        run: |
          bun run lint
          bun run typecheck
      - name: Run unit tests
        run: bun test
