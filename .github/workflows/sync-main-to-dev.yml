name: Sync main to dev

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    concurrency:
      group: dev-branch-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Capture current dev head
        id: before
        run: echo "dev_sha=$(git ls-remote origin refs/heads/dev | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Sync main into dev safely
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: node scripts/sync-main-to-dev.mjs
      - name: Dispatch exact-SHA CI after a sync write
        if: steps.before.outputs.dev_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE_DEV_SHA: ${{ steps.before.outputs.dev_sha }}
        run: |
          set -euo pipefail
          after="$(git ls-remote origin refs/heads/dev | cut -f1)"
          [[ "$after" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$after" == "$BEFORE_DEV_SHA" ]]; then
            echo "dev head unchanged; no CI dispatch needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run ci.yml --repo "$GH_REPO" --ref dev
          node scripts/release-await-ci.mjs --sha "$after" --repo "$GH_REPO" \
            --checks '["ci-gate"]' --timeout-seconds 1800 --interval-seconds 30
