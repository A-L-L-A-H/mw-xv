name: Promotion policy gate

on:
  pull_request:
    branches: [dev, main]
  merge_group:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: promotion-policy-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  policy-gate:
    name: policy-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve and verify the exact policy event SHAs
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PAYLOAD: ${{ toJSON(github.event) }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import {
            resolvePolicyContext,
            verifyPolicyContext,
          } from './scripts/promotion-policy-gate.mjs';
          const context = resolvePolicyContext(
            process.env.EVENT_NAME,
            JSON.parse(process.env.EVENT_PAYLOAD),
            process.env.GITHUB_SHA_VALUE
          );
          const verified = verifyPolicyContext(context, process.env.GH_REPO);
          appendFileSync(process.env.GITHUB_OUTPUT, `head_sha=${verified.headSha}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `base_sha=${verified.baseSha}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `merge_sha=${verified.mergeSha}\n`);
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.context.outputs.merge_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the task registry is internally consistent
        run: node scripts/tasks/validate-tasks.mjs
      - name: Verify the exact diff scope and provenance boundary
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          GOVERNANCE_BREAK_GLASS: ${{ vars.GOVERNANCE_BREAK_GLASS || 'false' }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > policy-changed-files.txt
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { verifyChangedPaths } from './scripts/promotion-policy-gate.mjs';
          const files = readFileSync('policy-changed-files.txt', 'utf8').split(/\r?\n/u).filter(Boolean);
          verifyChangedPaths(files, { breakGlass: process.env.GOVERNANCE_BREAK_GLASS === 'true' });
          process.stdout.write(`Verified ${files.length} changed paths against the exact diff scope.\n`);
          NODE
      - name: Verify dependency status for the exact merge SHA
        env:
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git cat-file -e "$HEAD_SHA^{commit}"
          node scripts/check-release-provenance.mjs
