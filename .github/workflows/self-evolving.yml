name: Self-evolving loop

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  evolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    concurrency:
      group: dev-branch-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Capture expected dev head SHA
        id: head
        run: |
          set -euo pipefail
          echo "expected_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Enforce evolution constitution and pause kill-switch
        run: node scripts/evolution/check-constitution.mjs --enforce-pause
      - name: Verify monotonic fitness ratchet
        run: node scripts/evolution/check-ratchet.mjs
      - name: Collect sanitized signals and scan expired experiments
        run: |
          set -euo pipefail
          node scripts/evolution/collect-signals.mjs > evolution-signals.json
          node scripts/evolution/prune-expired-experiments.mjs > evolution-prune.json
      - name: Ratchet fitness snapshot on monotonic improvement
        id: ratchet
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { computeRepositoryFitness } from "./scripts/evolution/fitness-score.mjs";
            const baseline = JSON.parse(readFileSync("evolution/fitness-snapshot.json", "utf8"));
            const current = await computeRepositoryFitness();
            const improved =
              current.compositeScore > baseline.compositeScore ||
              current.apiRouteMaxLoc < baseline.apiRouteMaxLoc ||
              current.testFileCount > baseline.testFileCount ||
              current.addonPackageCount > baseline.addonPackageCount ||
              current.workflowCount > baseline.workflowCount ||
              current.legacyAllowlistCount < baseline.legacyAllowlistCount;
            if (improved) {
              await computeRepositoryFitness({ write: true });
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `improved=${improved ? "true" : "false"}\n`);
          '
      - name: Upload evolution telemetry report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-evolving-report
          retention-days: 7
          path: |
            evolution-signals.json
            evolution-prune.json
      - name: Commit and push fitness ratchet update to dev
        if: steps.ratchet.outputs.improved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_DEV_SHA: ${{ steps.head.outputs.expected_sha }}
        run: |
          set -euo pipefail
          rm -f evolution-signals.json evolution-prune.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evolution/fitness-snapshot.json evolution/fitness-history.jsonl
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(evolution): ratchet repository fitness baseline'
          node scripts/push-expected-ref.mjs origin HEAD refs/heads/dev "$EXPECTED_DEV_SHA"
          result_sha="$(git rev-parse HEAD)"
          [[ "$result_sha" =~ ^[a-f0-9]{40}$ ]]
          gh workflow run ci.yml --repo "$GH_REPO" --ref dev
          node scripts/release-await-ci.mjs --sha "$result_sha" --repo "$GH_REPO" \
            --checks '["ci-gate"]' --timeout-seconds 1800 --interval-seconds 30
          gh workflow run promote.yml --repo "$GH_REPO" --ref dev -f expected_sha="$result_sha"
