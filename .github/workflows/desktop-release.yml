name: Desktop Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to attach desktop bundles to (leave empty for dry-run build)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && !github.event.release.draft && (github.event.release.target_commitish == 'main' || github.event.release.target_commitish == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_key: windows-x86_64
          - os: ubuntu-latest
            platform_key: linux-x86_64
          - os: macos-latest
            platform_key: darwin-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24'
          pnpm-version: '11.17.0'

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install Linux Tauri v2 system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Ensure stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Build workspace, desktop runtime, web UI, and portable sidecar
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          pnpm --filter @moonwitness/desktop build
          pnpm --filter @moonwitness/desktop build:web
          node apps/desktop/scripts/prepare-portable-sidecar.mjs

      - name: Build Tauri v2 desktop bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx --yes @tauri-apps/cli@2 build --config apps/desktop/src-tauri/tauri.conf.json

      - name: Stage desktop release bundles and updater metadata
        shell: bash
        env:
          PLATFORM_KEY: ${{ matrix.platform_key }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const platformKey = process.env.PLATFORM_KEY;
          const bundleRoot = path.resolve('apps/desktop/src-tauri/target/release/bundle');
          const outDir = path.resolve('desktop-release-out', platformKey);
          fs.mkdirSync(outDir, { recursive: true });

          const ALLOWED_EXTS = [
            '.exe',
            '.msi',
            '.nsis.zip',
            '.AppImage',
            '.deb',
            '.rpm',
            '.dmg',
            '.app.tar.gz',
            '.tar.gz',
            '.sig',
          ];

          const files = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name.endsWith('.app')) continue;
                walk(full);
              } else if (entry.isFile()) {
                if (ALLOWED_EXTS.some((ext) => entry.name.endsWith(ext))) {
                  const dest = path.join(outDir, entry.name);
                  fs.copyFileSync(full, dest);
                  files.push(entry.name);
                }
              }
            }
          }

          walk(bundleRoot);
          if (files.length === 0) {
            throw new Error(`No Tauri v2 bundle artifacts found in ${bundleRoot}`);
          }

          const sigFile = files.find((name) => name.endsWith('.sig'));
          const updaterAsset = sigFile
            ? sigFile.slice(0, -4)
            : files.find((name) => !name.endsWith('.sig')) ?? files[0];

          const assetPath = path.join(outDir, updaterAsset);
          const sha256 = crypto
            .createHash('sha256')
            .update(fs.readFileSync(assetPath))
            .digest('hex');
          const signature = sigFile
            ? fs.readFileSync(path.join(outDir, sigFile), 'utf8').trim()
            : '';

          fs.writeFileSync(
            path.join(outDir, 'platform-manifest.json'),
            JSON.stringify(
              {
                platformKey,
                updaterAsset,
                signature,
                sha256,
                files: files.sort(),
              },
              null,
              2,
            ) + '\n',
            'utf8',
          );
          NODE

      - name: Upload platform desktop bundles
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-bundle-${{ matrix.platform_key }}
          path: desktop-release-out/${{ matrix.platform_key }}
          if-no-files-found: error
          retention-days: 7

  publish-desktop-release:
    needs: [build-desktop]
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-asset-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the requested tag is an immutable main descendant
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_TAG" refs/remotes/origin/main

      - name: Download platform desktop bundles
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: desktop-bundle-*
          path: desktop-artifacts

      - name: Assemble latest.json updater manifest
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_NOTES: ${{ github.event.release.body || 'MoonWitness Desktop release' }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at || '' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const repo = process.env.GH_REPOSITORY;
          const releaseTag = process.env.RELEASE_TAG;
          const version = releaseTag.replace(/^v/u, '');
          const pubDate = process.env.RELEASE_PUBLISHED_AT || new Date().toISOString();
          const notes = process.env.RELEASE_NOTES || `MoonWitness Desktop ${releaseTag}`;
          const artifactsRoot = path.resolve('desktop-artifacts');
          const uploadDir = path.resolve('release-upload');
          fs.mkdirSync(uploadDir, { recursive: true });

          const platforms = {};
          for (const entry of fs.readdirSync(artifactsRoot, { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;
            const dir = path.join(artifactsRoot, entry.name);
            const manifestPath = path.join(dir, 'platform-manifest.json');
            if (!fs.existsSync(manifestPath)) continue;
            const meta = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            for (const fileName of meta.files) {
              fs.copyFileSync(path.join(dir, fileName), path.join(uploadDir, fileName));
            }
            platforms[meta.platformKey] = {
              url: `https://github.com/${repo}/releases/download/${releaseTag}/${encodeURIComponent(meta.updaterAsset)}`,
              signature: meta.signature || '',
              sha256: meta.sha256,
            };
          }

          const latestManifest = {
            version,
            notes,
            pub_date: pubDate,
            releaseUrl: `https://github.com/${repo}/releases/tag/${releaseTag}`,
            platforms,
          };

          fs.writeFileSync(
            path.join(uploadDir, 'latest.json'),
            JSON.stringify(latestManifest, null, 2) + '\n',
            'utf8',
          );
          NODE

      - name: Upload desktop bundles and latest.json to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" --json assets --jq '.assets[].name' || true)"
          for asset in release-upload/*; do
            name="$(basename "$asset")"
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              echo "Release asset '$name' already exists; refusing to overwrite it." >&2
              exit 1
            fi
          done
          gh release upload "$RELEASE_TAG" release-upload/* --repo "$GH_REPOSITORY"
