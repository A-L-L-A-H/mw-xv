name: Roadmap progress report

on:
  push:
    branches: [dev]
    paths:
      - ROADMAP.md
      - docs/tasks/tasks.json
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Prepare progress output directory
        run: mkdir -p dist/roadmap-progress
      - name: Generate Markdown progress report
        run: node scripts/roadmap/progress-dashboard.mjs --output dist/roadmap-progress/roadmap-progress.md
      - name: Generate JSON progress report
        run: node scripts/roadmap/progress-dashboard.mjs --format json --output dist/roadmap-progress/roadmap-progress.json
      - name: Upload progress artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: roadmap-progress
          path: dist/roadmap-progress/
          if-no-files-found: error
          retention-days: 7
