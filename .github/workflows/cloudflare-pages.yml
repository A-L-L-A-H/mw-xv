name: Deploy Documentation to Cloudflare Pages

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/docs/**'
      - 'packages/ui/**'
      - 'packages/assets/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-deployment
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'preview') }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          node-version: '24'
          bun-version: '1.4.5'

      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build documentation
        working-directory: apps/docs
        run: bun run portal:build:cf
        env:
          MW_DOCS_CHANNEL: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'stable' || 'preview') }}
          MW_DOCS_SOURCE_REF: ${{ github.sha }}
          MW_DOCS_APPLICATION_VERSION: ${{ github.run_number }}
          MW_DOCS_BASE_PATH: /

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/dist --project-name=moonwitness-docs --branch="${{ github.ref_name }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Documentation deployment to Cloudflare Pages failed"
          exit 1
