name: Roadmap issue sync

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply bounded issue creates/updates instead of planning only
        required: false
        type: boolean
        default: false
      task_ids:
        description: Comma-separated roadmap task IDs to sync when apply=true
        required: false
        type: string
        default: ''
      backfill_next_batch:
        description: Select the next bounded batch of pending creates/updates
        required: false
        type: boolean
        default: false
      stale_sync_retry_count:
        description: Bounded stale-dev retry counter (0 to 2)
        required: false
        type: number
        default: 0
      batch_continuation_count:
        description: Bounded continuation chain counter (0 to 3)
        required: false
        type: number
        default: 0

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: read
      checks: read
    outputs:
      changed_task_ids: ${{ steps.select.outputs.changed_task_ids }}
      backfill_task_ids: ${{ steps.select.outputs.backfill_task_ids }}
      source_sha: ${{ steps.select.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          node-version: '24'
          bun-version: '1.4.5'
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build @moonwitness/types
        run: bun --filter @moonwitness/types build
      - name: Plan read-only roadmap issue sync and select bounded batch
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          mkdir -p dist/roadmap-issue-sync
          plan_file="$(mktemp "$GITHUB_WORKSPACE/dist/roadmap-issue-sync/plan.XXXXXX")"
          trap 'rm -f "$plan_file"' EXIT
          SOURCE_SHA="$(git rev-parse HEAD)"
          export SOURCE_SHA
          node scripts/roadmap/sync-issues.mjs --quiet --output "$plan_file"
          TASK_IDS_AUTO=""
          if [[ "$EVENT_NAME" == "push" && "$EVENT_REF" == "refs/heads/dev" && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            TASK_IDS_AUTO="$(node scripts/roadmap/changed-task-ids.mjs --base "$BEFORE_SHA" --head "$SOURCE_SHA" || true)"
            if [[ -n "$TASK_IDS_AUTO" ]]; then
              echo "Changed roadmap tasks selected for bounded automatic sync: $TASK_IDS_AUTO"
            fi
          fi
          BACKFILL_AUTO="$(node scripts/roadmap/select-issue-sync-batch.mjs "$plan_file" || true)"
          echo "changed_task_ids=$TASK_IDS_AUTO" >> "$GITHUB_OUTPUT"
          echo "backfill_task_ids=$BACKFILL_AUTO" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  apply:
    needs: [plan]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.plan.outputs.changed_task_ids != '') ||
      (github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.plan.outputs.backfill_task_ids != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
      issues: write
      checks: read
    concurrency:
      group: roadmap-issue-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          node-version: '24'
          bun-version: '1.4.5'
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build @moonwitness/types
        run: bun --filter @moonwitness/types build
      - name: Collect lifecycle evidence and apply selected tasks with fresh-state guards
        run: |
          set -euo pipefail
          mkdir -p dist/roadmap-issue-sync
          batch_file="$(mktemp "$GITHUB_WORKSPACE/dist/roadmap-issue-sync/batch.XXXXXX")"
          snapshot_file="$(mktemp "$GITHUB_WORKSPACE/dist/roadmap-issue-sync/snapshot.XXXXXX")"
          trap 'rm -f "$batch_file" "$snapshot_file"' EXIT

          SELECTION_TASK_IDS=""
          if [[ "$EVENT_NAME" == "push" ]]; then
            SELECTION_TASK_IDS="$CHANGED_TASK_IDS"
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            SELECTION_TASK_IDS="$BACKFILL_TASK_IDS"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$INPUT_TASK_IDS" ]]; then
              TASK_IDS="$INPUT_TASK_IDS"
              SELECTION_TASK_IDS="$TASK_IDS"
            elif [[ "$BACKFILL_NEXT" == "true" ]]; then
              SELECTION_TASK_IDS="$BACKFILL_TASK_IDS"
            fi
          fi
          if [[ -z "$SELECTION_TASK_IDS" ]]; then
            echo "No task IDs selected for bounded issue sync."
            exit 0
          fi

          export ISSUE_SYNC_TASK_IDS="$SELECTION_TASK_IDS"
          export ISSUE_SYNC_BATCH_FILE="$batch_file"
          node scripts/roadmap/issue-sync-continuation.mjs prepare
          TASK_IDS="$(jq -r '.applyTaskIds | join(",")' "$batch_file")"
          if [[ -z "$TASK_IDS" ]]; then
            exit 0
          fi

          git fetch origin dev main --no-tags --quiet || true
          git fetch origin dev --no-recurse-submodules --quiet
          latest_dev_sha="$(git rev-parse refs/remotes/origin/dev)"
          if [[ "$(git rev-parse refs/remotes/origin/dev)" != "$SOURCE_SHA" ]]; then
            LATEST_DEV_SHA="$latest_dev_sha" node scripts/roadmap/resume-stale-issue-sync.mjs
            exit 0
          fi

          node scripts/roadmap/collect-lifecycle-snapshot-cli.mjs
          if [[ -f ".roadmap-lifecycle-snapshot.json" ]]; then
            cp ".roadmap-lifecycle-snapshot.json" "$snapshot_file"
            rm -f ".roadmap-lifecycle-snapshot.json"
          fi
          if [[ ! -s "$snapshot_file" ]]; then
            echo "Lifecycle snapshot not produced (likely stale dev head); aborting issue apply."
            exit 0
          fi

          git fetch origin dev --no-recurse-submodules --quiet
          latest_dev_sha="$(git rev-parse refs/remotes/origin/dev)"
          if [[ "$(git rev-parse refs/remotes/origin/dev)" != "$SOURCE_SHA" ]]; then
            LATEST_DEV_SHA="$latest_dev_sha" node scripts/roadmap/resume-stale-issue-sync.mjs
            exit 0
          fi

          node scripts/roadmap/sync-issues.mjs --quiet --apply --task-ids "$TASK_IDS" --lifecycle-snapshot "$snapshot_file"

          git fetch origin dev --no-recurse-submodules --quiet
          latest_dev_sha="$(git rev-parse refs/remotes/origin/dev)"
          if [[ "$(git rev-parse refs/remotes/origin/dev)" != "$SOURCE_SHA" ]]; then
            LATEST_DEV_SHA="$latest_dev_sha" node scripts/roadmap/resume-stale-issue-sync.mjs
            exit 0
          fi

          node scripts/roadmap/issue-sync-continuation.mjs dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          CHANGED_TASK_IDS: ${{ needs.plan.outputs.changed_task_ids }}
          BACKFILL_TASK_IDS: ${{ needs.plan.outputs.backfill_task_ids }}
          INPUT_TASK_IDS: ${{ inputs.task_ids }}
          BACKFILL_NEXT: ${{ inputs.backfill_next_batch }}
          TASK_IDS: ${{ inputs.task_ids }}
          BATCH_CONTINUATION_COUNT: ${{ inputs.batch_continuation_count || 0 }}
          STALE_SYNC_RETRY_COUNT: ${{ inputs.stale_sync_retry_count || 0 }}
