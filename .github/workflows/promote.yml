name: Promote dev to main

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact dev SHA this promotion is allowed to act on
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: promotion-pr-metadata
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      actions: write
      contents: write
      checks: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Refuse promotion while the fleet is paused
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/fleet-stop.mjs probe --repo "$GH_REPO"
      - name: Bind an intentional dispatch to the exact dev SHA
        env:
          INPUT_SHA: ${{ inputs.expected_sha || '' }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_SHA" ]]; then
            [[ "$INPUT_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$INPUT_SHA" = "$EVENT_SHA"
          fi
      - name: Skip stale promotion events
        id: stale
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin refs/heads/dev | cut -f1)"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main refs/heads/dev:refs/remotes/origin/dev
          git fetch --tags origin --quiet || true
          base_sha="$(git rev-parse refs/remotes/origin/main)"
          head_sha="$(git rev-parse refs/remotes/origin/dev)"
          if [[ "$head_sha" != "$EXPECTED_SHA" ]]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ahead="$(git rev-list --count "${base_sha}..${EXPECTED_SHA}")"
          behind="$(git rev-list --count "${EXPECTED_SHA}..${base_sha}")"
          if [[ "$ahead" == "0" ]]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
      - name: Mint optional automation GitHub App token
        id: app-token
        if: vars.AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
      - name: Auto-sync main into dev when promotion branch is behind
        if: steps.stale.outputs.stale != 'true' && steps.stale.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run sync-main-to-dev.yml --repo "$GH_REPO" --ref main
          echo "Dispatched sync-main-to-dev.yml because dev is behind main by ${{ steps.stale.outputs.behind }} commit(s)." >> "$GITHUB_STEP_SUMMARY"
      - name: Create or find the promotion pull request
        id: pr
        if: steps.stale.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            url="$(gh pr create --base main --head dev --title "release: promote dev to main" --body "Automated promotion pull request from dev to main.")"
            number="${url##*/}"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Classify risk from commits and changed paths
        id: risk
        if: steps.stale.outputs.stale != 'true'
        env:
          BASE_SHA: ${{ steps.stale.outputs.base_sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/check-promotion-risk.mjs "$BASE_SHA" "$EXPECTED_SHA" > promotion-risk.json
          node scripts/check-promotion-risk.mjs "$BASE_SHA" "$EXPECTED_SHA" --summary >> "$GITHUB_OUTPUT"
      - name: Refresh exact-SHA promotion report
        if: steps.stale.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.stale.outputs.base_sha }}
          EXPECTED_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/commits/$EXPECTED_SHA/check-runs?per_page=100" > promotion-checks.json
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if node scripts/release-plan.mjs --head "$EXPECTED_SHA" --baseline-sha "$BASE_SHA" > promotion-release-plan.json; then
            true
          elif [[ -n "$latest_tag" ]] && node scripts/release-plan.mjs --head "$EXPECTED_SHA" --baseline-tag "$latest_tag" > promotion-release-plan.json; then
            true
          else
            echo '{"status":"unavailable"}' > promotion-release-plan.json
          fi
          gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json body --jq '.body // ""' > promotion-current-body.md
          report_file="$(mktemp)"
          trap 'rm -f "$report_file" promotion-risk.json promotion-checks.json promotion-release-plan.json promotion-current-body.md' EXIT
          node scripts/render-promotion-report.mjs \
            "$BASE_SHA" \
            "$EXPECTED_SHA" \
            promotion-risk.json \
            promotion-checks.json \
            promotion-release-plan.json \
            promotion-current-body.md \
            "$report_file" \
            "$GH_REPO"
          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --body-file "$report_file"
      - name: Verify evolution constitution and fitness ratchet
        id: evolution_gate
        if: steps.stale.outputs.stale != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/evolution/check-constitution.mjs --enforce-pause
          node scripts/evolution/check-ratchet.mjs
      - name: Require exact-SHA CI and policy gates before any merge
        id: ci_gate
        if: steps.stale.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # policy-gate is enforced by the ruleset on the merge_group SHA; this
          # push-time gate requires the exact-SHA technical aggregate only.
          # Poll CI until it completes on the exact dev SHA instead of taking a
          # one-shot snapshot before the lanes finish (~20 min), which previously
          # locked in pass=false and permanently blocked autonomous promotion.
          if node scripts/release-await-ci.mjs --sha "$EXPECTED_SHA" --repo "$GH_REPO" \
              --checks '["ci-gate", "postgres-integration"]' \
              --timeout-seconds 2400 --interval-seconds 30; then
            echo "pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "pass=false" >> "$GITHUB_OUTPUT"
            echo "Exact-SHA ci-gate/postgres-integration checks are not successful; promotion stays blocked." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Ensure approval-required label exists
        if: >-
          steps.stale.outputs.stale != 'true' && (
            steps.evolution_gate.outcome != 'success' ||
            steps.ci_gate.outputs.pass != 'true' ||
            (steps.risk.outputs.approval_required == 'true' && vars.AUTONOMOUS_PROMOTE != 'true')
          )
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create approval-required --repo "$GH_REPO" --color B60205 --description "Requires CODEOWNER approval before merging to main" --force
      - name: Disable auto-merge and mark sensitive promotion
        if: >-
          steps.stale.outputs.stale != 'true' && (
            steps.evolution_gate.outcome != 'success' ||
            steps.ci_gate.outputs.pass != 'true' ||
            (steps.risk.outputs.approval_required == 'true' && vars.AUTONOMOUS_PROMOTE != 'true')
          )
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --add-label approval-required
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --disable-auto || true
      - name: Enable merge for compatible, low-risk promotion
        if: >-
          steps.stale.outputs.stale != 'true' &&
          steps.evolution_gate.outcome == 'success' &&
          steps.ci_gate.outputs.pass == 'true' &&
          (steps.risk.outputs.approval_required != 'true' || vars.AUTONOMOUS_PROMOTE == 'true')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          labels="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json labels --jq '[.labels[].name]')"
          if jq -e 'index("approval-required") != null' <<< "$labels" >/dev/null; then
            gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --remove-label approval-required
          fi
          if ! gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --merge --match-head-commit "$EXPECTED_SHA"; then
            gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --merge --match-head-commit "$EXPECTED_SHA"
          fi
