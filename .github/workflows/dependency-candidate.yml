name: Dependency update candidate

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Exact workspace dependency package name
        required: true
        type: string
      target_version:
        description: Exact candidate semver version to test
        required: true
        type: string
      expected_source_sha:
        description: Full current dev SHA to update cleanly
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.bundle.outputs.candidate_sha }}
      expected_source_sha: ${{ inputs.expected_source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          node-version: '24'
          bun-version: '1.4.5'
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Validate and build dependency update candidate
        id: bundle
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          TARGET_VERSION: ${{ inputs.target_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          ACTUAL_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$ACTUAL_SOURCE_SHA"
          node scripts/dependency-candidate.mjs \
            --package "$PACKAGE_NAME" \
            --version "$TARGET_VERSION" \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bun.lock package.json apps/*/package.json packages/*/package.json
          git commit -m "chore(deps): update $PACKAGE_NAME to $TARGET_VERSION"
          candidate_sha="$(git rev-parse HEAD)"
          git bundle create candidate.bundle HEAD
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Upload candidate bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-candidate
          path: candidate.bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: dev-branch-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download verified candidate bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-candidate
      - name: Verify parent and fast-forward dev atomically
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.validate.outputs.expected_source_sha }}
        run: |
          set -euo pipefail
          git fetch candidate.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          test "$(git rev-parse FETCH_HEAD^)" = "$EXPECTED_SOURCE_SHA"
          node scripts/push-expected-ref.mjs origin "$EXPECTED_CANDIDATE_SHA" refs/heads/dev "$EXPECTED_SOURCE_SHA"

  dispatch:
    needs: [validate, publish]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Dispatch full CI, await exact-SHA gates, then dispatch promotion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$CANDIDATE_SHA"
          gh workflow run ci.yml --repo "$GH_REPO" --ref dev
          node scripts/release-await-ci.mjs --sha "$CANDIDATE_SHA" --repo "$GH_REPO" \
            --checks '["ci-gate"]' --timeout-seconds 1800 --interval-seconds 30
          gh workflow run promote.yml --repo "$GH_REPO" --ref dev -f expected_sha="$CANDIDATE_SHA"
