name: Roadmap issue intake
run-name: Roadmap intake comment ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Skip previously reported issue comment
        id: dedupe
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_COMMENT_ID: ${{ github.event.comment.id }}
          GITHUB_COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/roadmap/issue-intake-dedupe.mjs >> "$GITHUB_OUTPUT"
      - name: Require the least-privilege GitHub App permission verifier
        if: steps.dedupe.outputs.skip != 'true'
        env:
          ROADMAP_INTAKE_APP_CLIENT_ID: ${{ vars.ROADMAP_INTAKE_APP_CLIENT_ID }}
          ROADMAP_INTAKE_APP_PRIVATE_KEY: ${{ secrets.ROADMAP_INTAKE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$ROADMAP_INTAKE_APP_CLIENT_ID" || -z "$ROADMAP_INTAKE_APP_PRIVATE_KEY" ]]; then
            echo "ROADMAP_INTAKE_APP_CLIENT_ID and ROADMAP_INTAKE_APP_PRIVATE_KEY must be configured." >&2
            exit 2
          fi
      - name: Mint repository-scoped metadata-read token
        id: intake-token
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.ROADMAP_INTAKE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROADMAP_INTAKE_APP_PRIVATE_KEY }}
          permission-metadata: read
      - name: Verify actor and report a read-only proposal
        if: steps.dedupe.outputs.skip != 'true'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_TOKEN: ${{ steps.intake-token.outputs.token }}
        run: |
          set -euo pipefail
          node scripts/roadmap/run-issue-intake.mjs > "$GITHUB_STEP_SUMMARY"
      - name: Report already processed comment
        if: steps.dedupe.outputs.skip == 'true'
        run: echo "Issue comment already processed by an earlier successful run."
