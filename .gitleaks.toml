title = "MoonWitness secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Exact synthetic fixtures and historical copies of their test patterns; credential findings are not allowlisted"
regexTarget = "line"
paths = ["\\.gitleaks-baseline\\.json$", "/?docs/assets/moonwitness/asset-map\\.json$"]
regexes = [
  '''^\s*"tokensSha256": "269a6e000da6fa288380cf36ec127df09cc86d6a38a1d4613a975b54d3664d5a"$''',
  '''^\s*idempotencyKey: 'duplicate-vote-0001',$''',
  '''^\s*idempotencyKey: 'reject-decision-0001',$''',
  '''^\s*idempotency_key: 'synthetic-resurrection-revoke-001',\r?$''',
  '''^\s*\/\^\\s\*"tokensSha256": "269a6e000da6fa288380cf36ec127df09cc86d6a38a1d4613a975b54d3664d5a"\$\/u,$''',
  '''^\s*\/\^\\s\*idempotencyKey: 'duplicate-vote-0001',\$\/u,$''',
  '''^\s*\/\^\\s\*idempotencyKey: 'reject-decision-0001',\$\/u,$''',
  '''^\s*'\^\\\\s\*"tokensSha256": "269a6e000da6fa288380cf36ec127df09cc86d6a38a1d4613a975b54d3664d5a"\$',$''',
  '''^\s*"\^\\\\s\*idempotencyKey: 'duplicate-vote-0001',\$",$''',
  '''^\s*"\^\\\\s\*idempotencyKey: 'reject-decision-0001',\$",$''',
  '''^\s*- Add adapter fixtures for API pagination, missing[/]duplicate checks, stale snapshots, revoked permissions, and malformed/untrusted webhook or issue events\.$''',
  '''mesh-cidr-fixture''',
  '''mesh-canonical-cidr-test-secret-0123456789''',
  '''peer-key-gamma-fixture''',
  '''peer-key-gamma-0123456789abcdef01234567''',
  '''FREELLMAPI_COMMIT_SHA: cd65d6485788dfc7828f06c1147cdea207b28322''',
]

[[allowlists]]
description = "orm-observability test fixtures: synthetic API keys used in telemetry redaction and ingestion tests"
regexTarget = "match"
paths = [
  "^packages/orm-observability/tests/telemetry-store\\.test\\.ts$",
  "^packages/orm-observability/tests/redaction\\.test\\.ts$",
  "^packages/orm-observability/tests/http-plugin\\.test\\.ts$",
]
regexes = [
  '''api_key: 'sk-test-12345678901234567890'''',
  '''providerKey: 'sk-proj-12345678901234567890'''',
  '''JWT_SECRET = 'observability-test-jwt-secret-1234567890'''',
]

[[allowlists]]
description = "Pinned third-party vendor snapshots keep their upstream test fixtures, docs and patches; reviewed at import time"
paths = ["^vendor/"]

[[allowlists]]
description = "PaaS template packs: third-party service templates with placeholder secrets (REDACTED, empty values) are not credentials"
paths = [
  "^packages/paas-template-pack-coolify/",
  "^packages/paas-template-pack-dokploy/",
  "^packages/paas-template-pack-bigbear/",
]

[[allowlists]]
description = "Agent observatory test: curl with REDACTED placeholder in test fixture"
paths = ["^tools/agent-observatory/server\\.test\\.mjs$"]

[[allowlists]]
description = "check-gitleaks-config: synthetic orm-observability fixtures and test expectations for secret scanning config"
regexTarget = "match"
paths = ["^scripts/check-gitleaks-config\\.test\\.mjs$", "^scripts/check-gitleaks-config\\.mjs$"]
regexes = [
  '''api_key: 'sk-test-12345678901234567890'''',
  '''providerKey: 'sk-proj-12345678901234567890'''',
  '''curl -s -w "\\n%\{http_code\}" -u elastic:"\$\$\{ELASTIC_PASSWORD\}" ''',
  '''curl -f -u "admin:real-password-123" ''',
  '''curl -s -w "\\n%\{http_code\}" -u elastic:"real-password-123" ''',
  '''xlibrechat-dev-api:6ecd1b510faaa593ad954fb6276c18e5f12a8e53 ''',
  '''idempotency_key: 'synthetic-resurrection-revoke-001'''',
]

[[allowlists]]
description = "Coolify service templates: dollar-escaped runtime variables and image digests are not credentials"
regexTarget = "match"
paths = [
  "^packages/paas-template-pack-coolify/compose/obsidian-livesync\\.yaml$",
  "^packages/paas-template-pack-coolify/compose/elasticsearch-with-kibana\\.yaml$",
  "^packages/paas-template-pack-coolify/compose/librechat\\.yaml$",
  "^packages/paas-template-pack-coolify/service-templates(?:-latest)?\\.json$",
]
regexes = [
  '''^curl -f -u "\$\$\{[A-Z0-9_]*(?:USER|PASSWORD)[A-Z0-9_]*\}:\$\$\{[A-Z0-9_]*(?:USER|PASSWORD)[A-Z0-9_]*\}" $''',
  '''^RESPONSE=\$\(curl -s -w "\\n%\{http_code\}" -u [a-z]+:"\$\$\{[A-Z0-9_]*PASSWORD[A-Z0-9_]*\}" $''',
  '''^librechat-dev-api:[0-9a-f]{40} $''',
]

[[allowlists]]
description = "WhatsApp test fixtures: synthetic API keys for standalone service tests"
regexTarget = "match"
paths = ["^apps/whatsapp/tests/whatsapp-service\\.test\\.ts$"]
