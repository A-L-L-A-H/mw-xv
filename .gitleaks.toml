regexes = [
  '''curl -fsS \\\r\n          -X POST \\\r\n          -u "elastic:\$\$ELASTIC_PASSWORD" ''',
  '''LANGFLOW_SECRET_KEY=PP_G4Gwm1lOkyG8r8N0LrdlpWXZ7Tyq5CVyfBquuj6g=''',
  '''keyzori:93b5d75ac8e5a4cd0740bfe1a46b5663674767fb''',
]

[[allowlists]]
