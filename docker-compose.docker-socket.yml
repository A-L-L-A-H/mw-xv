# Explicit opt-in for control-plane features that need the host Docker daemon.
# WARNING: mounting /var/run/docker.sock gives the container root-equivalent
# access to the host. Use only in trusted local development, never in production.
#
#   docker compose -f docker-compose.yml -f docker-compose.docker-socket.yml \
#     --profile docker-in-docker up control-plane-docker
#
# Do not run this service together with the default `control-plane` service:
# both expose 127.0.0.1:3003.
services:
  control-plane-docker:
    profiles: [docker-in-docker]
    extends:
      file: docker-compose.yml
      service: control-plane
    container_name: moonwitness-control-plane-docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control-plane_data:/data
