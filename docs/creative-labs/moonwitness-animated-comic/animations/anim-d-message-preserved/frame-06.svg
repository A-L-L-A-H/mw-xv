<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Final Moon Witness wide shot: serene Moon City skyline with deliberate negative space, silver crescent moon above, and quiet rooftop antenna below">
  <defs>
    <linearGradient id="sky-d6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.58" stop-color="#101a30"/>
      <stop offset="1" stop-color="#182642"/>
    </linearGradient>
    <radialGradient id="moon-halo-d6" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#f3efe4" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#d7e4ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d7e4ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon-surface-d6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8df"/>
      <stop offset="0.6" stop-color="#dce7ee"/>
      <stop offset="1" stop-color="#aabbd0"/>
    </linearGradient>
    <mask id="moon-crescent-d6">
      <rect width="960" height="540" fill="black"/>
      <circle cx="716" cy="138" r="68" fill="white"/>
      <circle cx="740" cy="120" r="64" fill="black"/>
    </mask>
    <linearGradient id="skyline-d6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141e33"/>
      <stop offset="1" stop-color="#0b101d"/>
    </linearGradient>
  </defs>

  <!-- Wide Serene Night Sky with Deliberate Negative Space -->
  <rect width="960" height="540" fill="url(#sky-d6)"/>

  <!-- Subtle Distant Stars -->
  <g fill="#dce7ee" opacity="0.55">
    <circle cx="148" cy="86" r="1.5"/>
    <circle cx="294" cy="132" r="1.2"/>
    <circle cx="432" cy="72" r="1.6"/>
    <circle cx="566" cy="158" r="1.2"/>
    <circle cx="842" cy="94" r="1.4"/>
    <circle cx="198" cy="214" r="1.1"/>
  </g>

  <!-- Silver Crescent Moon (Matching Moon City Canon) -->
  <circle cx="716" cy="138" r="112" fill="url(#moon-halo-d6)"/>
  <g mask="url(#moon-crescent-d6)">
    <circle cx="716" cy="138" r="68" fill="url(#moon-surface-d6)"/>
    <path d="M658 128 Q666 92 702 78" fill="none" stroke="#00b8f0" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Wide Moon City Midground Skyline -->
  <path d="M0 540 V394 H72 V342 H144 V382 H214 V358 H286 V408 H356 V370 H438 V414 H522 V364 H598 V396 H684 V334 H768 V378 H842 V318 H916 V372 H960 V540 Z" fill="url(#skyline-d6)" stroke="#243857" stroke-width="2.5"/>

  <!-- Calm Warm & Cyan Apartment Windows -->
  <g fill="#ffe031" opacity="0.72">
    <rect x="86" y="362" width="10" height="12"/>
    <rect x="104" y="362" width="10" height="12"/>
    <rect x="232" y="376" width="10" height="10"/>
    <rect x="702" y="354" width="10" height="14"/>
    <rect x="720" y="354" width="10" height="14"/>
    <rect x="858" y="340" width="10" height="14"/>
    <rect x="876" y="340" width="10" height="14"/>
  </g>
  <g fill="#39e6ff" opacity="0.52">
    <rect x="372" y="388" width="14" height="8"/>
    <rect x="540" y="382" width="12" height="10"/>
  </g>

  <!-- Quiet Rooftop Antenna & Warm Loft Window Below -->
  <g transform="translate(466, 336)">
    <path d="M0 16 L0 54 M-12 54 L0 36 L12 54" fill="none" stroke="#2c3342" stroke-width="3"/>
    <path d="M-14 14 C-10 26 10 26 14 14 Z" fill="#3a4354" stroke="#0d0d0d" stroke-width="2.5"/>
    <circle cx="2" cy="8" r="2.2" fill="#00d4ff"/>
    <!-- Warm Lit Loft Window -->
    <rect x="-24" y="64" width="48" height="28" rx="2" fill="#ffe678" stroke="#0d0d0d" stroke-width="2.5"/>
    <path d="M0 64 V92 M-24 78 H24" stroke="#0d0d0d" stroke-width="2"/>
  </g>
</svg>
