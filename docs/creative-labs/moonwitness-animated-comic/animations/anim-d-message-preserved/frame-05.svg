<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Pulse dissolves into night mist while two tiny shadowed silhouettes sit peacefully behind the warm lit archive loft window far below">
  <defs>
    <linearGradient id="sky-d5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="0.6" stop-color="#101a30"/>
      <stop offset="1" stop-color="#16223b"/>
    </linearGradient>
    <radialGradient id="win-glow-d5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe031" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe031" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#sky-d5)"/>

  <!-- Drifting Night Mist & Fading Outer Radio Ring -->
  <circle cx="540" cy="145" r="248" fill="none" stroke="#00d4ff" stroke-width="1.6" stroke-dasharray="16 14" opacity="0.28"/>
  <circle cx="540" cy="145" r="312" fill="none" stroke="#dce7ee" stroke-width="1.4" stroke-dasharray="10 18" opacity="0.18"/>
  <path d="M0 240 Q240 212 480 242 T960 226 L960 310 L0 310 Z" fill="#dce7ee" opacity="0.06"/>

  <!-- Distant Skyline -->
  <path d="M0 540 V356 H108 V318 H212 V346 H316 V298 H418 V358 H540 V326 H648 V364 H768 V312 H872 V342 H960 V540 Z" fill="#0b1120" stroke="#1b2a47" stroke-width="2.5"/>

  <!-- Archive Loft Building Facade in Foreground-Midground -->
  <rect x="336" y="294" width="288" height="246" fill="#151924" stroke="#0d0d0d" stroke-width="4.5"/>
  <!-- Small Rooftop Antenna on Loft Roof -->
  <g transform="translate(534, 214)">
    <path d="M0 26 L0 80 M-18 80 L0 52 L18 80" fill="none" stroke="#2c3342" stroke-width="4"/>
    <path d="M-20 22 C-14 38 14 38 20 22 Z" fill="#3a4354" stroke="#0d0d0d" stroke-width="3"/>
    <circle cx="4" cy="12" r="3" fill="#00d4ff"/>
  </g>

  <!-- Warm Lit Loft Window Far Below with Two Tiny Shadowed Silhouettes (Vesper & Kuro) -->
  <g transform="translate(406, 356)">
    <circle cx="74" cy="48" r="96" fill="url(#win-glow-d5)"/>
    <rect x="0" y="0" width="148" height="96" rx="4" fill="#ffe678" stroke="#0d0d0d" stroke-width="4.5"/>
    <!-- Left Shadowed Silhouette (Kuro in Hoodie + Headset) -->
    <path d="M24 96 C24 72 34 62 46 62 C58 62 66 72 68 96 Z" fill="#181c26"/>
    <circle cx="46" cy="48" r="12" fill="#181c26"/>
    <path d="M52 38 L56 26" stroke="#181c26" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right Shadowed Silhouette (Vesper Bob + Goggles) -->
    <path d="M84 96 C84 70 94 60 108 60 C122 60 130 70 132 96 Z" fill="#181c26"/>
    <circle cx="108" cy="46" r="12.5" fill="#181c26"/>
    <!-- Window Mullions -->
    <path d="M74 0 V96 M0 48 H148" stroke="#0d0d0d" stroke-width="4"/>
  </g>
</svg>
