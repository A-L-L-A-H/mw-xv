<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Subtle comic panel border with corner halftone vignette and gaffer tape strips">
  <defs>
    <pattern id="corner-halftone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.4" fill="#0d0d0d" opacity="0.32"/>
    </pattern>
  </defs>

  <!-- Subtle Corner Halftone Vignettes -->
  <polygon points="0,0 130,0 0,130" fill="url(#corner-halftone)"/>
  <polygon points="960,0 830,0 960,130" fill="url(#corner-halftone)"/>
  <polygon points="0,540 130,540 0,410" fill="url(#corner-halftone)"/>
  <polygon points="960,540 830,540 960,410" fill="url(#corner-halftone)"/>

  <!-- Comic Panel Ink Border -->
  <rect x="10" y="10" width="940" height="520" fill="none" stroke="#0d0d0d" stroke-width="5"/>
  <rect x="16" y="16" width="928" height="508" fill="none" stroke="#f2efe9" stroke-width="1.5" opacity="0.28"/>

  <!-- Corner Gaffer Tape Strips (Zine Aesthetic) -->
  <rect x="-6" y="22" width="68" height="16" transform="rotate(-38 28 30)" fill="#ff2e88" stroke="#0d0d0d" stroke-width="2.5" opacity="0.88"/>
  <rect x="898" y="502" width="68" height="16" transform="rotate(-38 932 510)" fill="#ffe031" stroke="#0d0d0d" stroke-width="2.5" opacity="0.88"/>
</svg>
