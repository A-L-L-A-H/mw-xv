<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Measured restraint held pose: Vesper Ink rests hands cleanly framing the incomplete sheet with yellow binder clip ready while Kuro settles back listening">
  <defs>
    <linearGradient id="bg-c6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141822"/>
      <stop offset="1" stop-color="#0d1018"/>
    </linearGradient>
    <radialGradient id="lamp-c6" cx="0.64" cy="0.24" r="0.54">
      <stop offset="0" stop-color="#ffe031" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#ffe031" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crt-c6" cx="0.14" cy="0.48" r="0.35">
      <stop offset="0" stop-color="#00b8f0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#00b8f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="halftone-c6" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#0d0d0d" opacity="0.22"/>
    </pattern>
    <pattern id="violet-dots-c6" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.3" fill="#9d4edd" opacity="0.38"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#bg-c6)"/>
  <g stroke="#202636" stroke-width="2" opacity="0.45">
    <path d="M0 95H960 M0 165H960 M0 235H960 M0 305H960"/>
    <path d="M160 95V165 M360 95V165 M560 95V165 M760 95V165"/>
  </g>
  <rect width="960" height="540" fill="url(#lamp-c6)"/>
  <rect width="960" height="540" fill="url(#crt-c6)"/>

  <!-- KURO SIGNAL (Left, Settled Back in Side Profile, Listening Calmly) -->
  <g id="kuro-c6" transform="translate(185, 168)">
    <path d="M-84 148 C-66 106 -18 98 34 112 L74 146 L68 256 L-94 256 Z" fill="#1e2028" stroke="#0d0d0d" stroke-width="4.5"/>
    <path d="M-54 106 C-24 88 22 92 44 114 C22 130 -24 130 -54 106 Z" fill="#ff2e88" stroke="#0d0d0d" stroke-width="4"/>
    <polygon points="24,148 28,136 34,144 40,134 44,148" fill="#ffe031" stroke="#0d0d0d" stroke-width="2.5"/>
    <!-- Side Profile Head -->
    <g transform="translate(8, 22)">
      <path d="M-60 32 C-76 8 -66 -34 -36 -48 C-16 -68 22 -70 46 -46 C68 -36 74 0 58 26 L-44 68 Z" fill="#0d0d0d"/>
      <path d="M-20 8 C-20 52 2 76 32 76 C56 72 66 48 62 12 C58 -16 34 -28 8 -28 C-12 -28 -20 -12 -20 8 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4"/>
      <ellipse cx="42" cy="22" rx="5.5" ry="7" fill="#0d0d0d"/>
      <circle cx="44" cy="19.5" r="2" fill="#ffffff"/>
      <path d="M30 8 L54 10" stroke="#0d0d0d" stroke-width="3.2" stroke-linecap="round"/>
      <rect x="26" y="34" width="16" height="7" rx="2" fill="#f2efe9" stroke="#0d0d0d" stroke-width="2"/>
      <path d="M34 54 Q46 56 54 52" fill="none" stroke="#0d0d0d" stroke-width="3" stroke-linecap="round"/>
      <!-- Headset -->
      <path d="M-14 -4 C-8 -52 38 -52 50 -6" fill="none" stroke="#2c303a" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="2" cy="24" rx="14" ry="20" fill="#2c303a" stroke="#0d0d0d" stroke-width="4"/>
      <ellipse cx="2" cy="24" rx="7" ry="11" fill="none" stroke="#00d4ff" stroke-width="3.5"/>
      <path d="M12 -18 L24 -72" stroke="#2c303a" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="24" cy="-72" r="4.5" fill="#00d4ff" stroke="#0d0d0d" stroke-width="2"/>
    </g>
  </g>

  <!-- VESPER INK (Center-Right, Calm Eye Contact, Composed Held Pose) -->
  <g id="vesper-c6" transform="translate(590, 108)">
    <!-- Back Hair -->
    <path d="M-78 92 C-94 142 -78 198 -48 220 L74 216 C100 186 108 130 94 78 C80 22 44 -4 -4 -4 C-52 -4 -88 38 -78 92 Z" fill="#f2efe9" stroke="#0d0d0d" stroke-width="4.5"/>
    <path d="M-74 116 C-84 158 -68 196 -46 216 L72 212 C90 188 98 150 90 110 Z" fill="url(#violet-dots-c6)"/>

    <!-- Torso -->
    <path d="M-112 272 C-102 222 -68 204 -26 198 L38 198 C84 204 118 228 128 276 L138 328 L-124 328 Z" fill="#1c1e24" stroke="#0d0d0d" stroke-width="4.5"/>
    <path d="M-20 170 L-22 210 Q4 224 28 210 L26 170 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4"/>
    <path d="M-70 214 L-50 198 L-34 216 L-38 246 L44 246 L40 216 L56 198 L76 214 L86 328 L-80 328 Z" fill="#c8a986" stroke="#0d0d0d" stroke-width="4"/>
    <!-- Two Yellow Binder Clips -->
    <rect x="-32" y="234" width="24" height="18" rx="2" fill="#ffe031" stroke="#0d0d0d" stroke-width="3"/>
    <rect x="-30" y="272" width="24" height="18" rx="2" fill="#ffe031" stroke="#0d0d0d" stroke-width="3"/>
    <!-- Magenta Tape -->
    <rect x="18" y="252" width="46" height="12" transform="rotate(14 41 258)" fill="#ff2e88" stroke="#0d0d0d" stroke-width="2.5"/>
    <rect x="16" y="270" width="46" height="12" transform="rotate(14 39 276)" fill="#ff2e88" stroke="#0d0d0d" stroke-width="2.5"/>
    <!-- Satchel Strap -->
    <path d="M56 196 L88 210 L-12 328 L-44 328 Z" fill="#968b6f" stroke="#0d0d0d" stroke-width="4"/>

    <!-- Face (Calm, Steady Eye Contact, Gentle Composed Smile) -->
    <path d="M-54 88 C-56 144 -34 178 4 182 C44 178 64 142 62 88 C60 44 34 26 4 26 C-30 26 -52 46 -54 88 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4.5"/>
    <g stroke="#0d0d0d" stroke-width="3.5" stroke-linecap="round">
      <path d="M-38 98 Q-24 93 -12 98" fill="none"/>
      <path d="M16 98 Q30 93 44 98" fill="none"/>
      <path d="M-36 112 Q-24 108 -12 114" fill="none" stroke-width="4"/>
      <path d="M18 114 Q30 108 42 112" fill="none" stroke-width="4"/>
      <ellipse cx="-26" cy="115" rx="5.5" ry="4.5" fill="#0d0d0d"/>
      <ellipse cx="26" cy="115" rx="5.5" ry="4.5" fill="#0d0d0d"/>
      <circle cx="-28" cy="113.5" r="1.5" fill="#ffffff" stroke="none"/>
      <circle cx="24" cy="113.5" r="1.5" fill="#ffffff" stroke="none"/>
    </g>
    <path d="M2 126 L-2 138 L5 140" fill="none" stroke="#0d0d0d" stroke-width="3" stroke-linecap="round"/>
    <path d="M-12 154 Q4 161 20 153" fill="none" stroke="#0d0d0d" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Front Bangs + Violet/Cyan Streaks -->
    <path d="M-64 78 C-74 128 -62 168 -40 198 C-48 164 -48 124 -42 94 C-22 92 -2 72 8 54 C12 72 22 86 38 92 C48 124 48 160 40 190 C66 164 78 126 74 74 C66 18 32 -6 -4 -6 C-46 -6 -72 28 -64 78 Z" fill="#f2efe9" stroke="#0d0d0d" stroke-width="4.5"/>
    <path d="M-54 88 C-62 128 -54 164 -40 194 C-38 164 -38 126 -32 94 Z" fill="#9d4edd" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M-62 104 C-68 136 -60 166 -46 190 C-50 162 -52 132 -48 106 Z" fill="#00b8f0" stroke="#0d0d0d" stroke-width="2.5"/>
    <path d="M52 114 C56 142 52 168 42 188 C58 168 64 140 60 112 Z" fill="#00b8f0" stroke="#0d0d0d" stroke-width="2.5"/>

    <!-- Forehead Goggles -->
    <g transform="translate(2, 42) rotate(-3)">
      <path d="M-64 6 L66 6" stroke="#4a3c24" stroke-width="8" stroke-linecap="round"/>
      <circle cx="-30" cy="4" r="24" fill="#caa354" stroke="#0d0d0d" stroke-width="4"/>
      <circle cx="-30" cy="4" r="17" fill="#c084fc" stroke="#0d0d0d" stroke-width="3"/>
      <circle cx="30" cy="4" r="24" fill="#caa354" stroke="#0d0d0d" stroke-width="4"/>
      <circle cx="30" cy="4" r="17" fill="#00d4ff" stroke="#0d0d0d" stroke-width="3"/>
    </g>
  </g>

  <!-- Desk Surface & Cleanly Framed Incomplete Sheet -->
  <path d="M0 404 L960 400 L960 540 L0 540 Z" fill="#2c2927" stroke="#0d0d0d" stroke-width="5"/>
  <rect x="0" y="404" width="960" height="136" fill="url(#halftone-c6)"/>
  <polygon points="360,420 820,416 854,524 326,528" fill="#1b222c" stroke="#0d0d0d" stroke-width="4"/>

  <!-- Incomplete Signal Sheet with Yellow Binder Clip Ready & Both Hands Resting Cleanly -->
  <g transform="translate(474, 428)">
    <polygon points="0,10 218,6 234,82 12,86" fill="#f2efe9" stroke="#0d0d0d" stroke-width="4.5" stroke-linejoin="round"/>
    <g stroke="#222630" stroke-width="3.5" stroke-linecap="round">
      <path d="M22 26 H102 M148 24 H202"/>
      <path d="M24 44 H82"/>
      <path d="M26 64 H200"/>
    </g>
    <rect x="108" y="18" width="34" height="12" fill="none" stroke="#ff2e88" stroke-width="2.5" stroke-dasharray="4 3"/>
    <rect x="88" y="36" width="76" height="12" fill="none" stroke="#ff2e88" stroke-width="2.5" stroke-dasharray="4 3"/>
    <!-- Yellow Binder Clip Ready on Top-Right Corner -->
    <g transform="translate(184, -2) rotate(8)">
      <path d="M6 0 C6 -12 18 -12 18 0" fill="none" stroke="#d8dee9" stroke-width="2.5"/>
      <rect x="0" y="0" width="24" height="18" rx="2" fill="#ffe031" stroke="#0d0d0d" stroke-width="3"/>
    </g>
    <!-- Vesper Hands Resting Cleanly on Either Side -->
    <path d="M-36 32 C-38 14 -14 8 4 20 L8 48 C-2 60 -28 56 -36 32 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4"/>
    <path d="M222 18 C242 10 264 20 260 44 L236 56 C218 52 216 32 222 18 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4"/>
    <!-- Brass Stylus Resting Parallel Beside Sheet -->
    <path d="M262 66 L326 24" stroke="#caa354" stroke-width="7" stroke-linecap="round"/>
    <path d="M262 66 L326 24" stroke="#0d0d0d" stroke-width="2"/>
  </g>
</svg>
