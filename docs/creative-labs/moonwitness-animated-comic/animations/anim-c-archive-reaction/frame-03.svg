<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Medium close-up of Vesper Ink analytically inspecting the signal slip as goggles catch cyan and violet glint">
  <defs>
    <linearGradient id="bg-c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1726"/>
      <stop offset="0.55" stop-color="#141824"/>
      <stop offset="1" stop-color="#1e1a18"/>
    </linearGradient>
    <radialGradient id="cyan-rim-c3" cx="0.22" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm-rim-c3" cx="0.86" cy="0.24" r="0.45">
      <stop offset="0" stop-color="#ffe031" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffe031" stop-opacity="0"/>
    </radialGradient>
    <pattern id="violet-dots-c3" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#9d4edd" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#bg-c3)"/>
  <rect width="960" height="540" fill="url(#cyan-rim-c3)"/>
  <rect width="960" height="540" fill="url(#warm-rim-c3)"/>

  <!-- MEDIUM CLOSE-UP: VESPER INK WAIST-UP -->
  <g id="vesper-c3" transform="translate(480, 48)">
    <!-- Back Hair -->
    <path d="M-126 130 C-148 202 -124 278 -76 308 L112 304 C150 264 164 184 142 108 C120 32 68 -8 -8 -8 C-82 -8 -138 54 -126 130 Z" fill="#f2efe9" stroke="#0d0d0d" stroke-width="5"/>
    <path d="M-120 166 C-134 226 -110 278 -74 304 L108 300 C138 264 148 214 136 160 Z" fill="url(#violet-dots-c3)"/>

    <!-- Shoulders & Utility Apron -->
    <path d="M-190 412 C-170 330 -116 302 -44 294 L56 294 C132 302 184 338 204 416 L220 492 L-204 492 Z" fill="#1c1e24" stroke="#0d0d0d" stroke-width="5"/>
    <path d="M-32 252 L-34 310 Q4 328 42 310 L40 252 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4.5"/>
    <path d="M-108 318 L-78 296 L-52 320 L-58 366 L68 366 L62 320 L88 296 L118 318 L132 492 L-124 492 Z" fill="#c8a986" stroke="#0d0d0d" stroke-width="4.5"/>
    <!-- Yellow Binder Clips -->
    <g transform="translate(-54, 344)">
      <path d="M8 0 C8 -16 24 -16 24 0" fill="none" stroke="#d8dee9" stroke-width="3"/>
      <rect x="0" y="0" width="32" height="24" rx="2" fill="#ffe031" stroke="#0d0d0d" stroke-width="3.5"/>
    </g>
    <!-- Magenta Tape -->
    <rect x="28" y="378" width="66" height="16" transform="rotate(14 61 386)" fill="#ff2e88" stroke="#0d0d0d" stroke-width="3"/>
    <!-- Satchel Strap -->
    <path d="M88 292 L134 312 L-12 492 L-64 492 Z" fill="#968b6f" stroke="#0d0d0d" stroke-width="4.5"/>

    <!-- Face (Close-Up Analytical Expression) -->
    <path d="M-84 128 C-86 212 -52 264 6 270 C66 264 98 210 96 128 C92 62 52 36 6 36 C-46 36 -82 64 -84 128 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="5"/>
    <!-- Subtle Cyan Under-Lighting on Chin/Cheeks from Slip/CRT -->
    <path d="M-74 190 C-56 242 -20 264 6 266 C34 264 68 242 84 190 C54 226 -44 226 -74 190 Z" fill="#00d4ff" opacity="0.16"/>

    <!-- Sharp Analytical Brow & Focused Eyes Pausing on Missing Gaps -->
    <g stroke="#0d0d0d" stroke-linecap="round">
      <path d="M-62 138 Q-38 134 -16 144" fill="none" stroke-width="4.5"/>
      <path d="M22 144 Q44 134 68 138" fill="none" stroke-width="4.5"/>
      <!-- Half-lidded Eyes -->
      <path d="M-58 158 Q-38 152 -18 160" fill="none" stroke-width="5"/>
      <path d="M24 160 Q44 152 64 158" fill="none" stroke-width="5"/>
      <path d="M-54 170 Q-38 174 -22 169" fill="none" stroke-width="2.5"/>
      <path d="M28 169 Q44 174 60 170" fill="none" stroke-width="2.5"/>
      <!-- Pupils Focused Sharply Downward -->
      <ellipse cx="-38" cy="164" rx="8.5" ry="6.5" fill="#0d0d0d"/>
      <ellipse cx="44" cy="164" rx="8.5" ry="6.5" fill="#0d0d0d"/>
      <circle cx="-41" cy="162" r="2.5" fill="#00d4ff" stroke="none"/>
      <circle cx="41" cy="162" r="2.5" fill="#00d4ff" stroke="none"/>
    </g>
    <!-- Nose & Composed Analytical Mouth (flat/thoughtful) -->
    <path d="M2 184 L-4 202 L6 205" fill="none" stroke="#0d0d0d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-16 228 Q4 226 24 228" fill="none" stroke="#0d0d0d" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Asymmetric Front Bangs + Violet/Cyan Streaks -->
    <path d="M-98 114 C-112 192 -92 254 -60 300 C-72 248 -72 188 -62 140 C-32 136 -2 106 12 78 C20 106 34 128 58 136 C72 186 72 242 60 288 C98 248 118 190 112 110 C100 26 48 -10 -8 -10 C-70 -10 -110 42 -98 114 Z" fill="#f2efe9" stroke="#0d0d0d" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-84 130 C-96 194 -84 250 -60 296 C-58 250 -58 192 -48 140 Z" fill="#9d4edd" stroke="#0d0d0d" stroke-width="3.5"/>
    <path d="M-96 154 C-104 204 -92 250 -70 288 C-76 244 -78 198 -72 158 Z" fill="#00b8f0" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M78 168 C84 212 78 252 64 284 C86 252 96 208 90 166 Z" fill="#00b8f0" stroke="#0d0d0d" stroke-width="3"/>

    <!-- Brass Forehead Goggles Catching Vivid Violet & Cyan Glint -->
    <g transform="translate(4, 62) rotate(-3)">
      <path d="M-98 8 L100 8" stroke="#4a3c24" stroke-width="11" stroke-linecap="round"/>
      <path d="M-18 4 Q0 -8 18 4" fill="none" stroke="#8a6c34" stroke-width="10" stroke-linecap="round"/>
      <!-- Viewer-left Violet Lens -->
      <circle cx="-46" cy="6" r="36" fill="#caa354" stroke="#0d0d0d" stroke-width="5"/>
      <circle cx="-46" cy="6" r="26" fill="#c084fc" stroke="#0d0d0d" stroke-width="3.5"/>
      <path d="M-64 -6 L-32 -16 L-24 -4 L-58 10 Z" fill="#ffffff" opacity="0.72"/>
      <!-- Viewer-right Cyan Lens -->
      <circle cx="46" cy="6" r="36" fill="#caa354" stroke="#0d0d0d" stroke-width="5"/>
      <circle cx="46" cy="6" r="26" fill="#00d4ff" stroke="#0d0d0d" stroke-width="3.5"/>
      <path d="M28 -6 L60 -16 L68 -4 L34 10 Z" fill="#ffffff" opacity="0.78"/>
      <!-- Sharp Glint Star on Cyan Lens -->
      <path d="M62 -16 L66 -28 L70 -16 L82 -12 L70 -8 L66 4 L62 -8 L50 -12 Z" fill="#ffffff"/>
    </g>

    <!-- Foreground Signal Slip Held Up Close in Both Hands -->
    <g transform="translate(-148, 344)">
      <polygon points="0,12 296,-12 312,148 -16,148" fill="#f2efe9" stroke="#0d0d0d" stroke-width="5" stroke-linejoin="round"/>
      <!-- Intact Signal Lines -->
      <g stroke="#222630" stroke-width="4.5" stroke-linecap="round">
        <path d="M26 36 H134 M192 30 H266"/>
        <path d="M28 66 H104"/>
        <path d="M30 96 H260"/>
        <path d="M32 124 H186"/>
      </g>
      <!-- Missing / Blank Gap Zones -->
      <rect x="142" y="22" width="42" height="18" fill="#ff2e88" fill-opacity="0.14" stroke="#ff2e88" stroke-width="3" stroke-dasharray="6 4"/>
      <rect x="114" y="54" width="112" height="18" fill="#ff2e88" fill-opacity="0.14" stroke="#ff2e88" stroke-width="3" stroke-dasharray="6 4"/>
      <!-- Vesper Hands Framing the Slip -->
      <path d="M-24 62 C-28 32 2 18 22 30 L28 68 C22 88 -10 92 -24 62 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4.5"/>
      <path d="M276 22 C304 14 326 34 320 68 L294 84 C272 78 270 46 276 22 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4.5"/>
    </g>
  </g>
</svg>
