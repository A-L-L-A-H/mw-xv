<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Vesper Ink lowers the slip back to the blotter with a knowing half-smile and taps the two blank gap zones with her brass stylus">
  <defs>
    <linearGradient id="bg-c5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141822"/>
      <stop offset="1" stop-color="#0d1018"/>
    </linearGradient>
    <radialGradient id="lamp-c5" cx="0.62" cy="0.24" r="0.52">
      <stop offset="0" stop-color="#ffe031" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffe031" stop-opacity="0"/>
    </radialGradient>
    <pattern id="halftone-c5" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#0d0d0d" opacity="0.22"/>
    </pattern>
    <pattern id="violet-dots-c5" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.3" fill="#9d4edd" opacity="0.38"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#bg-c5)"/>
  <rect width="960" height="540" fill="url(#lamp-c5)"/>

  <!-- VESPER INK (Tilted Head with Knowing Half-Smile, Tapping Blank Gaps on Desk) -->
  <g id="vesper-c5" transform="translate(540, 102)">
    <!-- Back Hair -->
    <path d="M-80 94 C-96 144 -80 200 -48 222 L74 218 C100 188 108 132 94 78 C80 22 44 -4 -6 -4 C-54 -4 -90 38 -80 94 Z" fill="#f2efe9" stroke="#0d0d0d" stroke-width="4.5"/>
    <path d="M-76 118 C-86 160 -70 198 -48 218 L72 214 C90 190 98 152 90 112 Z" fill="url(#violet-dots-c5)"/>

    <!-- Torso -->
    <path d="M-116 276 C-104 224 -70 206 -26 200 L40 200 C88 206 122 230 132 280 L144 334 L-128 334 Z" fill="#1c1e24" stroke="#0d0d0d" stroke-width="4.5"/>
    <path d="M-20 172 L-22 212 Q4 226 28 212 L26 172 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4"/>
    <path d="M-72 216 L-52 200 L-36 218 L-40 248 L46 248 L42 218 L58 200 L78 216 L88 334 L-82 334 Z" fill="#c8a986" stroke="#0d0d0d" stroke-width="4"/>
    <rect x="-34" y="236" width="24" height="18" rx="2" fill="#ffe031" stroke="#0d0d0d" stroke-width="3"/>
    <rect x="-32" y="274" width="24" height="18" rx="2" fill="#ffe031" stroke="#0d0d0d" stroke-width="3"/>
    <rect x="20" y="256" width="46" height="12" transform="rotate(14 43 262)" fill="#ff2e88" stroke="#0d0d0d" stroke-width="2.5"/>
    <rect x="18" y="274" width="46" height="12" transform="rotate(14 41 280)" fill="#ff2e88" stroke="#0d0d0d" stroke-width="2.5"/>
    <path d="M58 198 L90 212 L-10 334 L-44 334 Z" fill="#968b6f" stroke="#0d0d0d" stroke-width="4"/>

    <!-- Head Tilted Slightly with Knowing Half-Smile -->
    <g transform="rotate(7 4 112)">
      <path d="M-56 90 C-58 146 -34 182 4 186 C44 182 66 144 64 90 C62 44 36 26 4 26 C-30 26 -54 46 -56 90 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4.5"/>
      <g stroke="#0d0d0d" stroke-width="3.5" stroke-linecap="round">
        <path d="M-38 98 Q-24 92 -12 98" fill="none"/>
        <path d="M16 96 Q30 90 44 96" fill="none"/>
        <path d="M-36 112 Q-24 108 -12 114" fill="none" stroke-width="4"/>
        <path d="M18 114 Q30 108 42 112" fill="none" stroke-width="4"/>
        <ellipse cx="-26" cy="116" rx="5.5" ry="4.5" fill="#0d0d0d"/>
        <ellipse cx="26" cy="116" rx="5.5" ry="4.5" fill="#0d0d0d"/>
      </g>
      <path d="M2 126 L-2 138 L5 140" fill="none" stroke="#0d0d0d" stroke-width="3" stroke-linecap="round"/>
      <!-- Knowing Half-Smile -->
      <path d="M-14 156 Q4 162 22 150" fill="none" stroke="#0d0d0d" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Bangs + Streaks -->
      <path d="M-66 80 C-76 132 -64 174 -42 204 C-50 170 -50 128 -44 96 C-22 94 -2 74 8 54 C14 74 24 88 40 94 C50 128 50 164 42 194 C68 168 80 128 76 76 C68 18 34 -6 -6 -6 C-48 -6 -74 28 -66 80 Z" fill="#f2efe9" stroke="#0d0d0d" stroke-width="4.5"/>
      <path d="M-56 90 C-64 132 -56 170 -42 200 C-40 170 -40 130 -34 96 Z" fill="#9d4edd" stroke="#0d0d0d" stroke-width="3"/>
      <path d="M-64 106 C-70 138 -62 170 -48 194 C-52 166 -54 134 -50 108 Z" fill="#00b8f0" stroke="#0d0d0d" stroke-width="2.5"/>
      <path d="M54 116 C58 144 54 170 44 192 C60 170 66 142 62 114 Z" fill="#00b8f0" stroke="#0d0d0d" stroke-width="2.5"/>

      <!-- Forehead Goggles -->
      <g transform="translate(2, 42) rotate(-3)">
        <path d="M-66 6 L68 6" stroke="#4a3c24" stroke-width="8" stroke-linecap="round"/>
        <circle cx="-31" cy="4" r="24" fill="#caa354" stroke="#0d0d0d" stroke-width="4"/>
        <circle cx="-31" cy="4" r="17" fill="#c084fc" stroke="#0d0d0d" stroke-width="3"/>
        <circle cx="31" cy="4" r="24" fill="#caa354" stroke="#0d0d0d" stroke-width="4"/>
        <circle cx="31" cy="4" r="17" fill="#00d4ff" stroke="#0d0d0d" stroke-width="3"/>
      </g>
    </g>
  </g>

  <!-- Desk Surface & Blotter -->
  <path d="M0 398 L960 394 L960 540 L0 540 Z" fill="#2c2927" stroke="#0d0d0d" stroke-width="5"/>
  <rect x="0" y="398" width="960" height="142" fill="url(#halftone-c5)"/>
  <polygon points="240,418 760,414 794,524 206,528" fill="#1b222c" stroke="#0d0d0d" stroke-width="4"/>

  <!-- Signal Slip Flat on Blotter -->
  <g transform="translate(362, 428)">
    <polygon points="0,10 236,6 254,84 14,88" fill="#f2efe9" stroke="#0d0d0d" stroke-width="4.5" stroke-linejoin="round"/>
    <g stroke="#222630" stroke-width="3.5" stroke-linecap="round">
      <path d="M24 28 H108 M158 26 H218"/>
      <path d="M26 46 H86"/>
      <path d="M28 66 H216"/>
    </g>
    <!-- Two Blank Gap Zones Highlighted by Stylus Tap -->
    <rect x="114" y="19" width="38" height="14" fill="#ff2e88" fill-opacity="0.16" stroke="#ff2e88" stroke-width="2.5" stroke-dasharray="4 3"/>
    <rect x="94" y="38" width="84" height="14" fill="#ff2e88" fill-opacity="0.16" stroke="#ff2e88" stroke-width="2.5" stroke-dasharray="4 3"/>

    <!-- Vesper Hand + Brass Stylus Tapping the Blank Gap Zone -->
    <g transform="translate(132, -4)">
      <!-- Tap Impact Rings (Anticipation Accent) -->
      <circle cx="2" cy="44" r="10" fill="none" stroke="#ffe031" stroke-width="2.5"/>
      <circle cx="2" cy="44" r="18" fill="none" stroke="#ffe031" stroke-width="2" stroke-dasharray="4 4"/>
      <!-- Stylus Angled Downward -->
      <path d="M2 44 L86 -36" stroke="#caa354" stroke-width="8" stroke-linecap="round"/>
      <path d="M2 44 L86 -36" stroke="#0d0d0d" stroke-width="2"/>
      <!-- Hand Holding Stylus -->
      <path d="M44 -14 C64 -26 92 -12 88 12 L62 24 C44 18 36 0 44 -14 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4"/>
    </g>
  </g>
</svg>
