<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Split-energy two-shot: Kuro lunges eagerly across the desk while Vesper stays rooted and calmly raises one hand and brass stylus vertically to halt the rush">
  <defs>
    <linearGradient id="bg-c4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#191426"/>
      <stop offset="0.48" stop-color="#141822"/>
      <stop offset="1" stop-color="#1a1816"/>
    </linearGradient>
    <radialGradient id="lamp-c4" cx="0.74" cy="0.22" r="0.46">
      <stop offset="0" stop-color="#ffe031" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffe031" stop-opacity="0"/>
    </radialGradient>
    <pattern id="halftone-c4" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#0d0d0d" opacity="0.22"/>
    </pattern>
    <pattern id="violet-dots-c4" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.3" fill="#9d4edd" opacity="0.38"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#bg-c4)"/>
  <rect width="960" height="540" fill="url(#lamp-c4)"/>

  <!-- Energy Contrast Lines behind Kuro ONLY (Left Side) -->
  <g stroke="#ff2e88" stroke-width="3" opacity="0.42">
    <path d="M0 70 L280 185 M0 140 L260 220 M0 220 L240 250 M40 20 L310 155"/>
  </g>
  <g stroke="#00d4ff" stroke-width="2.5" opacity="0.35">
    <path d="M0 105 L260 198 M0 180 L250 232"/>
  </g>

  <!-- KURO SIGNAL (Left, Lunging Eagerly Across Desk Corner, Wide Gesture) -->
  <g id="kuro-c4" transform="translate(215, 146) rotate(12)">
    <!-- Hoodie Torso Leaning Hard Forward -->
    <path d="M-92 150 C-72 106 -16 96 42 110 L118 148 L96 266 L-98 266 Z" fill="#1e2028" stroke="#0d0d0d" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Magenta Hood Collar & Splatters -->
    <path d="M-56 106 C-26 84 28 88 54 114 C30 132 -24 132 -56 106 Z" fill="#ff2e88" stroke="#0d0d0d" stroke-width="4"/>
    <path d="M-40 198 C-20 182 14 202 -2 222 C-18 236 -50 218 -40 198 Z" fill="#ff2e88"/>
    <!-- Yellow 3-Point Crown Pin -->
    <polygon points="32,146 36,134 42,142 48,132 52,146" fill="#ffe031" stroke="#0d0d0d" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Kuro Head (Energetic Forward Lean, Wide Determined Eyes, Open Excited Mouth) -->
    <g transform="translate(14, 18)">
      <!-- Spiky Black Hair -->
      <path d="M-64 34 C-86 12 -74 -34 -44 -48 C-26 -72 18 -76 46 -52 C78 -44 92 -4 72 28 C82 48 64 76 40 76 L-44 74 C-68 68 -78 48 -64 34 Z" fill="#0d0d0d"/>
      <!-- Face -->
      <path d="M-38 8 C-38 56 -14 84 22 84 C54 80 68 50 64 12 C60 -20 34 -34 4 -34 C-24 -34 -38 -16 -38 8 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4"/>
      <!-- Wide Excited Eyes -->
      <ellipse cx="2" cy="24" rx="8" ry="10" fill="#0d0d0d"/>
      <ellipse cx="40" cy="24" rx="7.5" ry="10" fill="#0d0d0d"/>
      <circle cx="0" cy="20" r="3" fill="#ffffff"/>
      <circle cx="38" cy="20" r="3" fill="#ffffff"/>
      <path d="M-12 6 L14 12 M28 12 L52 4" stroke="#0d0d0d" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Nose & Cheek Bandages -->
      <rect x="14" y="34" width="16" height="7" rx="2" fill="#f2efe9" stroke="#0d0d0d" stroke-width="2"/>
      <rect x="-24" y="42" width="18" height="8" rx="2" transform="rotate(-14 -15 46)" fill="#f2efe9" stroke="#0d0d0d" stroke-width="2"/>
      <!-- Open Energetic Mouth -->
      <path d="M8 54 Q24 48 40 54 Q34 72 16 70 Z" fill="#8b1e3f" stroke="#0d0d0d" stroke-width="3"/>
      <!-- Front Spiky Bangs -->
      <path d="M-46 8 L-24 -26 L-12 2 L12 -32 L26 2 L54 -22 L66 10 C64 -34 26 -54 -8 -48 C-42 -42 -58 -16 -46 8 Z" fill="#0d0d0d"/>
      <!-- Charcoal Headset with Cyan Ring & Upright Antenna -->
      <path d="M-38 -2 C-34 -56 36 -58 56 -4" fill="none" stroke="#2c303a" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="-34" cy="28" rx="14" ry="22" fill="#2c303a" stroke="#0d0d0d" stroke-width="4"/>
      <ellipse cx="-34" cy="28" rx="7" ry="12" fill="none" stroke="#00d4ff" stroke-width="3.5"/>
      <path d="M48 -14 L64 -76" stroke="#2c303a" stroke-width="5" stroke-linecap="round"/>
      <circle cx="64" cy="-76" r="5" fill="#00d4ff" stroke="#0d0d0d" stroke-width="2"/>
    </g>

    <!-- Kuro Outstretched Arm Gesturing "Ship It!" -->
    <path d="M86 146 L212 138 L224 166 L96 184 Z" fill="#1e2028" stroke="#0d0d0d" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M208 134 C228 124 252 132 252 148 C252 162 232 172 212 168 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4"/>
  </g>

  <!-- VESPER INK (Right, Completely Rooted, Calm, Raising One Hand + Brass Stylus Vertically to Halt) -->
  <g id="vesper-c4" transform="translate(690, 114)">
    <!-- Back Hair -->
    <path d="M-76 92 C-92 142 -76 196 -46 218 L72 214 C98 186 106 130 92 78 C78 24 44 -4 -4 -4 C-52 -4 -86 38 -76 92 Z" fill="#f2efe9" stroke="#0d0d0d" stroke-width="4.5"/>
    <path d="M-74 116 C-82 158 -68 194 -46 214 L70 210 C88 186 96 148 88 110 Z" fill="url(#violet-dots-c4)"/>

    <!-- Rooted Upright Torso -->
    <path d="M-108 268 C-98 220 -66 204 -26 198 L36 198 C82 204 114 226 124 272 L134 328 L-120 328 Z" fill="#1c1e24" stroke="#0d0d0d" stroke-width="4.5"/>
    <path d="M-20 170 L-22 210 Q4 224 28 210 L26 170 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4"/>
    <path d="M-68 212 L-50 198 L-34 214 L-38 244 L44 244 L40 214 L56 198 L74 212 L84 328 L-76 328 Z" fill="#c8a986" stroke="#0d0d0d" stroke-width="4"/>
    <!-- Yellow Binder Clips -->
    <rect x="-32" y="232" width="24" height="18" rx="2" fill="#ffe031" stroke="#0d0d0d" stroke-width="3"/>
    <rect x="-30" y="270" width="24" height="18" rx="2" fill="#ffe031" stroke="#0d0d0d" stroke-width="3"/>
    <!-- Magenta Tape -->
    <rect x="18" y="250" width="46" height="12" transform="rotate(14 41 256)" fill="#ff2e88" stroke="#0d0d0d" stroke-width="2.5"/>
    <rect x="16" y="268" width="46" height="12" transform="rotate(14 39 274)" fill="#ff2e88" stroke="#0d0d0d" stroke-width="2.5"/>
    <!-- Satchel Strap -->
    <path d="M56 196 L86 208 L-12 328 L-44 328 Z" fill="#968b6f" stroke="#0d0d0d" stroke-width="4"/>

    <!-- Face (Steady, Unfazed, Looking Left at Kuro) -->
    <path d="M-54 88 C-56 144 -34 178 4 182 C44 178 64 142 62 88 C60 44 34 26 4 26 C-30 26 -52 46 -54 88 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4.5"/>
    <g stroke="#0d0d0d" stroke-width="3.5" stroke-linecap="round">
      <path d="M-38 98 H-14 M16 98 H40" fill="none"/>
      <path d="M-36 112 H-12 M16 112 H40" fill="none" stroke-width="4"/>
      <ellipse cx="-28" cy="115" rx="5.5" ry="4.5" fill="#0d0d0d"/>
      <ellipse cx="22" cy="115" rx="5.5" ry="4.5" fill="#0d0d0d"/>
      <circle cx="-30" cy="113.5" r="1.5" fill="#ffffff" stroke="none"/>
      <circle cx="20" cy="113.5" r="1.5" fill="#ffffff" stroke="none"/>
    </g>
    <path d="M0 126 L-4 138 L4 140" fill="none" stroke="#0d0d0d" stroke-width="3" stroke-linecap="round"/>
    <path d="M-12 154 Q2 156 14 153" fill="none" stroke="#0d0d0d" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Front Bangs + Violet/Cyan Streaks -->
    <path d="M-64 78 C-74 128 -62 168 -40 198 C-48 164 -48 124 -42 94 C-22 92 -2 72 8 54 C12 72 22 86 38 92 C48 124 48 160 40 190 C66 164 78 126 74 74 C66 18 32 -6 -4 -6 C-46 -6 -72 28 -64 78 Z" fill="#f2efe9" stroke="#0d0d0d" stroke-width="4.5"/>
    <path d="M-54 88 C-62 128 -54 164 -40 194 C-38 164 -38 126 -32 94 Z" fill="#9d4edd" stroke="#0d0d0d" stroke-width="3"/>
    <path d="M-62 104 C-68 136 -60 166 -46 190 C-50 162 -52 132 -48 106 Z" fill="#00b8f0" stroke="#0d0d0d" stroke-width="2.5"/>
    <path d="M52 114 C56 142 52 168 42 188 C58 168 64 140 60 112 Z" fill="#00b8f0" stroke="#0d0d0d" stroke-width="2.5"/>

    <!-- Forehead Goggles -->
    <g transform="translate(2, 42) rotate(-3)">
      <path d="M-64 6 L66 6" stroke="#4a3c24" stroke-width="8" stroke-linecap="round"/>
      <circle cx="-30" cy="4" r="24" fill="#caa354" stroke="#0d0d0d" stroke-width="4"/>
      <circle cx="-30" cy="4" r="17" fill="#c084fc" stroke="#0d0d0d" stroke-width="3"/>
      <circle cx="30" cy="4" r="24" fill="#caa354" stroke="#0d0d0d" stroke-width="4"/>
      <circle cx="30" cy="4" r="17" fill="#00d4ff" stroke="#0d0d0d" stroke-width="3"/>
    </g>

    <!-- Raised Halt Hand + Vertical Brass Stylus (Clean Vertical Stop Barrier) -->
    <g transform="translate(-148, 126)">
      <path d="M22 142 L26 62" stroke="#f4d0b6" stroke-width="26" stroke-linecap="round"/>
      <path d="M10 142 L14 62 M34 142 L38 62" stroke="#0d0d0d" stroke-width="4"/>
      <!-- Vertical Brass Stylus Held Straight Up -->
      <rect x="18" y="-34" width="9" height="128" rx="4" fill="#caa354" stroke="#0d0d0d" stroke-width="3.5"/>
      <polygon points="18,-34 27,-34 22.5,-48" fill="#0d0d0d"/>
      <!-- Calm Open/Pinched Halt Hand -->
      <path d="M2 58 C0 32 10 22 24 24 C38 24 44 36 42 62 C38 80 8 82 2 58 Z" fill="#f4d0b6" stroke="#0d0d0d" stroke-width="4"/>
      <!-- Subtle Calm Vertical Pause Line Accent -->
      <path d="M-12 -24 V82" stroke="#ffe031" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <!-- Desk Surface with Slip Sitting Flat -->
  <path d="M0 416 L960 412 L960 540 L0 540 Z" fill="#2c2927" stroke="#0d0d0d" stroke-width="5"/>
  <rect x="0" y="416" width="960" height="124" fill="url(#halftone-c4)"/>
  <polygon points="432,438 594,434 610,492 444,496" fill="#f2efe9" stroke="#0d0d0d" stroke-width="4"/>
</svg>
