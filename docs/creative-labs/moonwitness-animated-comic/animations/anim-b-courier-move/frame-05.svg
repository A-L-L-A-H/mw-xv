<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="sky-b5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d1c"/>
      <stop offset="65%" stop-color="#111a31"/>
      <stop offset="100%" stop-color="#1a2442"/>
    </linearGradient>
    <pattern id="halftone-b5" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#0d0d0d" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#sky-b5)"/>
  <circle cx="210" cy="102" r="44" fill="#f3efe4" opacity="0.88"/>
  <circle cx="228" cy="90" r="38" fill="#0d1428"/>

  <!-- Archive Loft Roof & Hatch Doorway on Right -->
  <rect x="0" y="396" width="960" height="144" fill="#171d2c" stroke="#0d0d0d" stroke-width="4"/>
  <rect x="0" y="396" width="960" height="144" fill="url(#halftone-b5)"/>
  <rect x="740" y="196" width="220" height="204" fill="#1d2436" stroke="#0d0d0d" stroke-width="4"/>
  <rect x="772" y="232" width="128" height="168" rx="6" fill="#121724" stroke="#0d0d0d" stroke-width="4"/>
  <rect x="786" y="246" width="100" height="36" fill="#00e5ff" opacity="0.18" stroke="#0d0d0d" stroke-width="3"/>

  <!-- Skid Marks & Sparks under Braking Boot -->
  <g stroke-linecap="round">
    <line x1="360" y1="466" x2="544" y2="466" stroke="#0d0d0d" stroke-width="6"/>
    <line x1="390" y1="458" x2="532" y2="458" stroke="#ffe031" stroke-width="3" stroke-dasharray="12 8"/>
    <polygon points="562,464 576,450 572,464 588,462 574,472" fill="#ffe031" stroke="#0d0d0d" stroke-width="2"/>
    <circle cx="536" cy="448" r="8" fill="#f3efe4" opacity="0.7" stroke="#0d0d0d" stroke-width="2.5"/>
  </g>

  <!-- KURO SIGNAL: Frame 5 - Heel Plant Skid (forward leg drives down, body leaned hard back to brake) -->
  <g id="kuro-heel-skid" stroke="#0d0d0d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back Leg dragging low for balance -->
    <path d="M446 346 L396 394 L384 446 L412 452 L424 402 L468 358 Z" fill="#1c1f26" stroke-width="4"/>
    <path d="M372 440 L412 448 L408 468 L366 458 Z" fill="#181a20" stroke-width="4"/>
    <path d="M364 456 L410 466 L408 476 L362 466 Z" fill="#ffe031" stroke-width="4"/>

    <!-- Forward Braking Leg driven straight forward, heel digging into roof -->
    <path d="M472 340 L526 394 L554 442 L530 454 L502 408 L456 356 Z" fill="#20232a" stroke-width="4"/>
    <path d="M524 444 L568 430 L578 450 L534 464 Z" fill="#181a20" stroke-width="4"/>
    <path d="M532 462 L580 448 L584 458 L536 472 Z" fill="#ffe031" stroke-width="4"/>

    <!-- Magenta Hip Strap whipping forward from momentum -->
    <path d="M466 344 Q504 352 536 342 Q534 354 522 358 Q492 366 458 354 Z" fill="#ff2e88" stroke-width="3.5"/>

    <!-- Torso Leaned Hard Back at 30-deg Brake Angle -->
    <path d="M398 264 Q434 242 472 258 L484 344 Q444 358 410 342 Z" fill="#23262d" stroke-width="4.5"/>
    <path d="M398 264 Q434 242 472 258 L484 344 Q444 358 410 342 Z" fill="url(#halftone-b5)"/>
    <path d="M410 322 Q428 310 446 326 L478 342 L412 342 Z" fill="#ff2e88" stroke="none"/>
    <polygon points="442,278 446,288 454,280 458,288 462,278 462,294 442,294" fill="#ffe031" stroke-width="2.8"/>
    <path d="M406 260 Q436 276 466 256 Q456 238 430 240 Q408 244 406 260 Z" fill="#ff2e88" stroke-width="4"/>

    <!-- Back Arm outstretched for balance -->
    <path d="M404 270 L356 296 L336 280 L348 264 L366 276 L408 256 Z" fill="#23262d" stroke-width="4"/>
    <circle cx="338" cy="270" r="9" fill="#eab88e" stroke-width="3.5"/>

    <!-- Front Arm holding Receiver out ahead -->
    <path d="M464 266 L516 286 L538 264 L524 250 L506 266 L462 252 Z" fill="#23262d" stroke-width="4"/>
    <g transform="translate(526,232) rotate(18)">
      <rect x="0" y="0" width="32" height="44" rx="5" fill="#1b1f27" stroke="#0d0d0d" stroke-width="3.5"/>
      <rect x="5" y="6" width="22" height="14" rx="2" fill="#091322" stroke="#0d0d0d" stroke-width="2"/>
      <polyline points="7,14 12,9 17,18 22,10 25,14" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <polygon points="0,0 10,0 0,10" fill="#ffe031" stroke="#0d0d0d" stroke-width="1.8"/>
    </g>

    <!-- Head Leaned Back, Hair Whipping Forward -->
    <path d="M388 214 Q378 238 396 258 L458 256 Q474 236 468 212 Q458 184 428 184 Q394 186 388 214 Z" fill="#14161b" stroke-width="4.5"/>
    <path d="M408 212 Q410 252 438 258 Q462 252 466 220 Q462 198 436 198 Q410 200 408 212 Z" fill="#eab88e" stroke-width="4"/>
    <path d="M436 218 L458 222" stroke="#0d0d0d" stroke-width="3.5"/>
    <ellipse cx="448" cy="226" rx="6" ry="5" fill="#f3efe4" stroke-width="2.5"/>
    <circle cx="450" cy="226" r="3" fill="#0d0d0d"/>
    <rect x="446" y="234" width="14" height="6" rx="2" fill="#f3efe4" stroke-width="2.2"/>
    <rect x="424" y="240" width="12" height="6" rx="1.5" transform="rotate(-14 430 243)" fill="#f3efe4" stroke-width="2.2"/>
    <path d="M440 248 L454 246" stroke="#0d0d0d" stroke-width="2.8"/>

    <!-- Headset -->
    <circle cx="416" cy="226" r="14" fill="#2b303a" stroke-width="4"/>
    <circle cx="416" cy="226" r="8" fill="#00e5ff" stroke-width="2.5"/>
    <circle cx="416" cy="226" r="3.5" fill="#ff2e88" stroke="none"/>
    <line x1="410" y1="214" x2="394" y2="174" stroke="#0d0d0d" stroke-width="4"/>
    <circle cx="394" cy="172" r="4.5" fill="#ff2e88" stroke-width="2.5"/>
  </g>
</svg>
