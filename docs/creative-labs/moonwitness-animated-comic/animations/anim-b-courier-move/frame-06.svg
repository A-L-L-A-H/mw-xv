    <rect x="576" y="268" width="13" height="6" rx="1.5" transform="rotate(-14 582 271)" fill="#f3efe4" stroke-width="2.2"/>
    <path d="M598 278 Q606 282 614 278" fill="none" stroke="#0d0d0d" stroke-width="2.8"/>

