    <path d="M552 240 L568 222 L556 200 L586 208 L604 182 L622 208 L652 200 L642 224 L660 242 L644 276 L562 276 Z" fill="#14161b" stroke-width="4.5"/>
    <path d="M572 238 Q572 282 604 288 Q636 282 638 242 Q634 218 604 218 Q574 220 572 238 Z" fill="#eab88e" stroke-width="4"/>
    <path d="M582 246 L598 250" stroke="#0d0d0d" stroke-width="3.5"/>
    <ellipse cx="590" cy="254" rx="5.5" ry="5" fill="#0d0d0d"/>
