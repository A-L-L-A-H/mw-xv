    <path d="M564 252 Q560 204 604 200 Q648 204 644 252" fill="none" stroke="#2b303a" stroke-width="9"/>
    <ellipse cx="642" cy="254" rx="11" ry="17" fill="#2b303a" stroke-width="4"/>
    <ellipse cx="643" cy="254" rx="6" ry="11" fill="#00e5ff" stroke-width="2.5"/>
    <line x1="646" y1="238" x2="658" y2="192" stroke="#0d0d0d" stroke-width="4"/>
    <circle cx="658" cy="190" r="4.5" fill="#ff2e88" stroke-width="2.5"/>
    <ellipse cx="566" cy="254" rx="10" ry="16" fill="#2b303a" stroke-width="4"/>
