    <circle cx="542" cy="374" r="10" fill="#eab88e" stroke-width="3.5"/>

    <!-- Right Arm protecting Receiver near knee -->
    <path d="M650 304 L688 338 L670 370 L652 358 L664 340 L638 320 Z" fill="#23262d" stroke-width="4"/>
    <g transform="translate(658,348) rotate(12)">
      <rect x="0" y="0" width="34" height="46" rx="5" fill="#1b1f27" stroke="#0d0d0d" stroke-width="3.5"/>
