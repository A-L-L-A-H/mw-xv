    <path d="M624 368 L672 406 L658 456 L628 454 L638 412 L606 378 Z" fill="#1c1f26" stroke-width="4"/>
    <path d="M622 446 L666 446 L678 468 L616 468 Z" fill="#181a20" stroke-width="4"/>
    <path d="M614 466 L680 466 L680 478 L614 478 Z" fill="#ffe031" stroke-width="4"/>

    <!-- Magenta Hip Strap compressed outward -->
    <path d="M576 368 Q540 388 528 414 Q540 420 548 410 Q560 388 586 374 Z" fill="#ff2e88" stroke-width="3.5"/>

    <!-- Billowing Wide Squashed Hoodie Torso -->
    <path d="M548 296 Q604 282 658 298 L668 376 Q604 392 542 376 Z" fill="#23262d" stroke-width="4.5"/>
