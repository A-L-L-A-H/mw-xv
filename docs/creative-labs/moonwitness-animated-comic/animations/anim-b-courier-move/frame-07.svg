      <rect x="6" y="8" width="34" height="24" rx="3" fill="#091322" stroke="#0d0d0d" stroke-width="2.5"/>
      <polyline points="8,20 14,10 20,28 26,8 32,24 38,16" fill="none" stroke="#00e5ff" stroke-width="2.8"/>
      <polyline points="8,24 16,18 24,26 32,14 38,22" fill="none" stroke="#ff2e88" stroke-width="2"/>
      <polygon points="0,0 14,0 0,14" fill="#ffe031" stroke="#0d0d0d" stroke-width="2"/>
      <line x1="36" y1="0" x2="42" y2="-20" stroke="#0d0d0d" stroke-width="3.5"/>
