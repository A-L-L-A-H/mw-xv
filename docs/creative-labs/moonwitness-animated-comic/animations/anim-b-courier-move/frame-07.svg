    <line x1="698" y1="444" x2="710" y2="438" stroke="#ffe031" stroke-width="3"/>
    <line x1="700" y1="454" x2="714" y2="452" stroke="#ffe031" stroke-width="3"/>

    <!-- Magenta Hip Strap -->
    <path d="M584 336 Q562 370 558 406 Q568 410 574 400 Q578 372 594 340 Z" fill="#ff2e88" stroke-width="3.5"/>

