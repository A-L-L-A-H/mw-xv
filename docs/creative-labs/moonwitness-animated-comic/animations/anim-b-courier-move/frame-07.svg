<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="sky-b7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d1c"/>
      <stop offset="65%" stop-color="#111a31"/>
      <stop offset="100%" stop-color="#1a2442"/>
    </linearGradient>
    <radialGradient id="screen-glow-b7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="halftone-b7" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#0d0d0d" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#sky-b7)"/>
  <circle cx="210" cy="102" r="44" fill="#f3efe4" opacity="0.9"/>
  <circle cx="228" cy="90" r="38" fill="#0d1428"/>

