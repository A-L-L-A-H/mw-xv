    <circle cx="601" cy="176" r="3.2" fill="#0d0d0d"/>
    <ellipse cx="624" cy="176" rx="6.5" ry="7" fill="#f3efe4" stroke-width="2.8"/>
    <circle cx="627" cy="176" r="3.2" fill="#0d0d0d"/>
    <rect x="606" y="186" width="16" height="6.5" rx="2" fill="#f3efe4" stroke-width="2.5"/>
    <rect x="584" y="192" width="12" height="6" rx="1.5" transform="rotate(-14 590 195)" fill="#f3efe4" stroke-width="2.2"/>
    <!-- Impatient Grin -->
    <path d="M602 202 Q614 212 626 200 Z" fill="#f3efe4" stroke="#0d0d0d" stroke-width="2.6"/>

    <!-- Bangs -->
    <path d="M560 164 L576 146 L580 166 L596 142 L606 168 L622 146 L628 168 L646 156 Q636 122 602 118 Q564 120 560 164 Z" fill="#0d0d0d" stroke-width="4"/>

    <!-- Headset -->
    <path d="M566 178 Q562 126 604 122 Q646 126 642 178" fill="none" stroke="#2b303a" stroke-width="9"/>
    <ellipse cx="570" cy="180" rx="12" ry="18" fill="#2b303a" stroke-width="4"/>
    <ellipse cx="569" cy="180" rx="6.5" ry="12" fill="#00e5ff" stroke-width="2.5"/>
    <ellipse cx="569" cy="180" rx="3" ry="6" fill="#ff2e88" stroke="none"/>
    <line x1="564" y1="164" x2="552" y2="116" stroke="#0d0d0d" stroke-width="4"/>
