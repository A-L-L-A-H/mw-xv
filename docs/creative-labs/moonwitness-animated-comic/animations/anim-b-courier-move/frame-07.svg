    <path d="M570 232 Q606 222 642 236 L648 332 Q608 344 568 332 Z" fill="url(#halftone-b7)"/>
    <path d="M572 308 Q588 296 602 312 Q616 302 628 320 L624 332 L570 330 Z" fill="#ff2e88" stroke="none"/>
    <polygon points="616,258 620,270 628,260 634,270 638,258 638,276 616,276" fill="#ffe031" stroke-width="3"/>
    <path d="M578 228 Q606 250 638 232 Q632 214 606 212 Q578 214 578 228 Z" fill="#ff2e88" stroke-width="4"/>
    <path d="M592 242 L588 286" fill="none" stroke="#ff2e88" stroke-width="4"/>
    <path d="M612 244 L612 284" fill="none" stroke="#ff2e88" stroke-width="4"/>

