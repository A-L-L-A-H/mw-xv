    <path d="M636 242 L704 246 L706 266 L632 264 Z" fill="#23262d" stroke-width="4"/>
    <path d="M702 246 Q716 244 718 256 Q716 268 702 266 Z" fill="#eab88e" stroke-width="3.5"/>
    <circle cx="728" cy="244" r="54" fill="url(#screen-glow-b7)" stroke="none"/>
    <g transform="translate(706,210) rotate(8)">
