    <path d="M560 166 Q548 192 564 214 L636 216 L656 196 Q660 172 646 154 Q634 122 602 120 Q564 122 560 166 Z" fill="#14161b" stroke-width="4.5"/>
    <path d="M574 162 Q574 208 604 216 Q634 212 640 170 Q636 144 606 144 Q576 146 574 162 Z" fill="#eab88e" stroke-width="4"/>
