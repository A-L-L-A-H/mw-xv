    <path d="M614 336 L640 400 L646 456 L674 452 L666 396 L638 334 Z" fill="#1c1f26" stroke-width="4"/>
    <path d="M642 446 L682 436 L692 456 L646 468 Z" fill="#181a20" stroke-width="4"/>
    <path d="M644 466 L694 454 L696 464 L646 476 Z" fill="#ffe031" stroke-width="4"/>
