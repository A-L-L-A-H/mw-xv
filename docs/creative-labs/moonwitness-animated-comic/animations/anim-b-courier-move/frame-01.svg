<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="sky-b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d1c"/>
      <stop offset="65%" stop-color="#111a31"/>
      <stop offset="100%" stop-color="#1a2442"/>
    </linearGradient>
    <pattern id="halftone-b1" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#0d0d0d" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#sky-b1)"/>
  <circle cx="770" cy="96" r="44" fill="#f3efe4" opacity="0.9"/>
  <circle cx="788" cy="84" r="38" fill="#0d1428"/>

  <!-- Skyline across gap -->
  <g fill="#0c1224" stroke="#0d0d0d" stroke-width="3">
    <rect x="40" y="220" width="110" height="220"/>
    <rect x="210" y="190" width="120" height="250"/>
    <rect x="610" y="180" width="130" height="260"/>
    <rect x="780" y="210" width="140" height="230"/>
  </g>
  <path d="M0 148 Q480 218 960 156" fill="none" stroke="#0d0d0d" stroke-width="3.5"/>

  <!-- Left Rooftop Ledge (launch parapet) -->
  <rect x="0" y="396" width="440" height="144" fill="#171d2c" stroke="#0d0d0d" stroke-width="4"/>
  <rect x="0" y="396" width="440" height="144" fill="url(#halftone-b1)"/>
  <rect x="0" y="372" width="448" height="26" fill="#252d40" stroke="#0d0d0d" stroke-width="4"/>

  <!-- Distant Archive Loft Roof on right -->
  <rect x="720" y="408" width="240" height="132" fill="#141926" stroke="#0d0d0d" stroke-width="4"/>
  <rect x="712" y="388" width="248" height="22" fill="#21283a" stroke="#0d0d0d" stroke-width="4"/>

  <ellipse cx="286" cy="392" rx="76" ry="12" fill="#070a14" opacity="0.78"/>

  <!-- KURO SIGNAL: Frame 1 - Deep Coil Anticipation (low crouched runner coil on rooftop ledge, heels lifted) -->
  <g id="kuro-deep-coil" stroke="#0d0d0d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back Leg coiled low, heel lifted off ledge -->
    <path d="M262 320 L214 342 L222 374 L248 370 L242 346 L284 332 Z" fill="#1c1f26" stroke-width="4"/>
    <path d="M208 364 L246 356 L252 380 L218 386 Z" fill="#181a20" stroke-width="4"/>
    <path d="M206 376 L252 368 L256 382 L212 390 Z" fill="#ffe031" stroke-width="3.5"/>

    <!-- Front Leg compressed tightly at ledge edge -->
    <path d="M294 318 L342 340 L318 376 L292 372 L310 346 L278 332 Z" fill="#20232a" stroke-width="4"/>
    <path d="M290 364 L334 364 L344 382 L288 382 Z" fill="#181a20" stroke-width="4"/>
    <path d="M286 380 L346 380 L346 392 L286 392 Z" fill="#ffe031" stroke-width="4"/>

    <!-- Magenta Hip Strap coiled back -->
    <path d="M268 320 Q232 332 204 328 Q206 340 218 342 Q244 342 276 330 Z" fill="#ff2e88" stroke-width="3.5"/>

    <!-- Compressed Forward-Leaning Hoodie Torso -->
    <path d="M244 268 Q286 248 334 268 L322 332 Q278 338 242 322 Z" fill="#23262d" stroke-width="4.5"/>
    <path d="M244 268 Q286 248 334 268 L322 332 Q278 338 242 322 Z" fill="url(#halftone-b1)"/>
    <path d="M248 304 Q266 296 282 312 Q296 302 312 320 L308 330 L246 322 Z" fill="#ff2e88" stroke="none"/>
    <polygon points="304,280 308,290 314,282 320,290 324,280 324,296 304,296" fill="#ffe031" stroke-width="2.8"/>
    <!-- Hood compressed forward -->
    <path d="M250 264 Q288 278 324 262 Q314 242 284 244 Q256 246 250 264 Z" fill="#ff2e88" stroke-width="4"/>

    <!-- Back Arm cocked behind for explosive push -->
    <path d="M256 274 L212 290 L194 264 L212 254 L224 272 L262 260 Z" fill="#23262d" stroke-width="4"/>
    <circle cx="198" cy="258" r="9" fill="#eab88e" stroke-width="3.5"/>

    <!-- Front Arm tucking Portable Receiver tight against chest -->
    <path d="M318 274 L350 302 L322 322 L310 308 L328 296 L306 282 Z" fill="#23262d" stroke-width="4"/>
    <g transform="translate(314,296) rotate(12)">
      <rect x="0" y="0" width="32" height="42" rx="5" fill="#1b1f27" stroke="#0d0d0d" stroke-width="3.5"/>
      <rect x="5" y="6" width="22" height="14" rx="2" fill="#091322" stroke="#0d0d0d" stroke-width="2"/>
      <polyline points="7,14 12,9 17,18 22,10 25,14" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <polygon points="0,0 10,0 0,10" fill="#ffe031" stroke="#0d0d0d" stroke-width="1.8"/>
    </g>

    <!-- Head tucked low, locked forward toward gap -->
    <path d="M294 216 Q284 242 302 264 L362 262 Q378 242 372 216 Q362 186 332 184 Q298 186 294 216 Z" fill="#14161b" stroke-width="4.5"/>
    <path d="M314 214 Q316 256 344 262 Q368 256 372 222 Q368 200 342 200 Q316 202 314 214 Z" fill="#eab88e" stroke-width="4"/>
    <!-- Fierce determined eye facing right -->
    <path d="M342 220 L364 224" stroke="#0d0d0d" stroke-width="3.5"/>
    <ellipse cx="354" cy="228" rx="6" ry="5" fill="#f3efe4" stroke-width="2.5"/>
    <circle cx="356" cy="228" r="3" fill="#0d0d0d"/>
    <rect x="352" y="236" width="14" height="6" rx="2" fill="#f3efe4" stroke-width="2.2"/>
    <rect x="330" y="242" width="12" height="6" rx="1.5" transform="rotate(-14 336 245)" fill="#f3efe4" stroke-width="2.2"/>
    <path d="M346 250 L360 248" stroke="#0d0d0d" stroke-width="2.8"/>

    <!-- Headset (profile) -->
    <path d="M324 228 Q322 188 344 188" fill="none" stroke="#2b303a" stroke-width="9"/>
    <circle cx="322" cy="230" r="14" fill="#2b303a" stroke-width="4"/>
    <circle cx="322" cy="230" r="8" fill="#00e5ff" stroke-width="2.5"/>
    <circle cx="322" cy="230" r="3.5" fill="#ff2e88" stroke="none"/>
    <line x1="316" y1="216" x2="300" y2="176" stroke="#0d0d0d" stroke-width="4"/>
    <circle cx="300" cy="174" r="4.5" fill="#ff2e88" stroke-width="2.5"/>
  </g>
</svg>
