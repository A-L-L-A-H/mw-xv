<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="sky-b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d1c"/>
      <stop offset="65%" stop-color="#111a31"/>
      <stop offset="100%" stop-color="#1a2442"/>
    </linearGradient>
    <pattern id="halftone-b3" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#0d0d0d" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#sky-b3)"/>
  <circle cx="770" cy="96" r="44" fill="#f3efe4" opacity="0.92"/>
  <circle cx="788" cy="84" r="38" fill="#0d1428"/>

  <!-- Wide Moonlit Gap Between Buildings -->
  <g fill="#0c1224" stroke="#0d0d0d" stroke-width="3">
    <rect x="0" y="340" width="240" height="200"/>
    <rect x="700" y="330" width="260" height="210"/>
    <rect x="330" y="250" width="100" height="290" opacity="0.65"/>
    <rect x="510" y="270" width="110" height="270" opacity="0.65"/>
  </g>
  <path d="M0 170 Q480 240 960 176" fill="none" stroke="#0d0d0d" stroke-width="3.5"/>
  <path d="M0 326 L248 326 L248 350 L0 350 Z" fill="#252d40" stroke="#0d0d0d" stroke-width="4"/>
  <path d="M692 316 L960 316 L960 340 L692 340 Z" fill="#252d40" stroke="#0d0d0d" stroke-width="4"/>

  <!-- Vault Arc Motion Trail -->
  <path d="M210 260 Q480 90 640 180" fill="none" stroke="#00e5ff" stroke-width="4" opacity="0.55" stroke-dasharray="18 12"/>
  <path d="M230 282 Q480 120 620 205" fill="none" stroke="#ff2e88" stroke-width="3" opacity="0.55" stroke-dasharray="14 10"/>

  <!-- KURO SIGNAL: Frame 3 - Apex Rooftop Vault (mid-air parkour tuck over moonlit gap) -->
  <g id="kuro-apex-vault" stroke="#0d0d0d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tucked Parkour Legs -->
    <path d="M448 214 L498 232 L462 276 L440 264 L466 238 L434 228 Z" fill="#1c1f26" stroke-width="4"/>
    <path d="M432 262 L468 272 L460 294 L424 282 Z" fill="#181a20" stroke-width="4"/>
    <path d="M422 280 L462 292 L458 302 L418 290 Z" fill="#ffe031" stroke-width="4"/>

    <path d="M474 206 L532 214 L516 264 L490 256 L502 228 L464 222 Z" fill="#20232a" stroke-width="4"/>
    <path d="M488 254 L526 260 L522 282 L482 274 Z" fill="#181a20" stroke-width="4"/>
    <path d="M480 272 L524 280 L522 290 L478 282 Z" fill="#ffe031" stroke-width="4"/>

    <!-- Magenta Hip Strap trailing back horizontally -->
    <path d="M446 214 Q404 218 368 206 Q370 220 382 224 Q414 232 454 224 Z" fill="#ff2e88" stroke-width="3.5"/>

    <!-- Horizontal Tucked Hoodie Torso -->
    <path d="M440 156 Q486 138 528 164 L508 220 Q464 230 434 208 Z" fill="#23262d" stroke-width="4.5"/>
    <path d="M440 156 Q486 138 528 164 L508 220 Q464 230 434 208 Z" fill="url(#halftone-b3)"/>
    <path d="M442 192 Q462 186 476 202 L498 218 L438 208 Z" fill="#ff2e88" stroke="none"/>
    <polygon points="494,170 498,180 506,172 510,180 514,170 514,186 494,186" fill="#ffe031" stroke-width="2.8"/>
    <!-- Hood billowing back (overlapping action) -->
    <path d="M412 158 Q438 134 484 148 Q476 174 440 176 Q418 176 412 158 Z" fill="#ff2e88" stroke-width="4"/>

    <!-- Back Arm bracing air for balance -->
    <path d="M454 162 L404 140 L376 164 L392 178 L412 160 L458 178 Z" fill="#23262d" stroke-width="4"/>
    <circle cx="380" cy="172" r="9" fill="#eab88e" stroke-width="3.5"/>

    <!-- Front Arm clutching Receiver tight to chest -->
    <path d="M514 168 L548 192 L526 218 L510 206 L524 192 L502 180 Z" fill="#23262d" stroke-width="4"/>
    <g transform="translate(520,188) rotate(18)">
      <rect x="0" y="0" width="30" height="40" rx="5" fill="#1b1f27" stroke="#0d0d0d" stroke-width="3.5"/>
      <rect x="5" y="6" width="20" height="12" rx="2" fill="#091322" stroke="#0d0d0d" stroke-width="2"/>
      <polyline points="7,12 12,8 17,16 22,10" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <polygon points="0,0 10,0 0,10" fill="#ffe031" stroke="#0d0d0d" stroke-width="1.8"/>
    </g>

    <!-- Head locked on landing zone, hair streaming back -->
    <path d="M498 110 L468 106 L484 126 L466 140 L504 152 L560 152 Q574 130 568 108 Q558 84 530 84 Q502 86 498 110 Z" fill="#14161b" stroke-width="4.5"/>
    <path d="M516 108 Q518 148 544 154 Q568 148 572 116 Q568 96 544 96 Q518 98 516 108 Z" fill="#eab88e" stroke-width="4"/>
    <path d="M542 114 L562 118" stroke="#0d0d0d" stroke-width="3.5"/>
    <ellipse cx="554" cy="122" rx="6" ry="5" fill="#f3efe4" stroke-width="2.5"/>
    <circle cx="556" cy="122" r="3" fill="#0d0d0d"/>
    <rect x="552" y="130" width="14" height="6" rx="2" fill="#f3efe4" stroke-width="2.2"/>
    <rect x="530" y="136" width="12" height="6" rx="1.5" transform="rotate(-14 536 139)" fill="#f3efe4" stroke-width="2.2"/>
    <path d="M544 144 Q554 148 562 142" fill="none" stroke="#0d0d0d" stroke-width="2.8"/>

    <!-- Headset -->
    <circle cx="522" cy="124" r="14" fill="#2b303a" stroke-width="4"/>
    <circle cx="522" cy="124" r="8" fill="#00e5ff" stroke-width="2.5"/>
    <circle cx="522" cy="124" r="3.5" fill="#ff2e88" stroke="none"/>
    <line x1="514" y1="112" x2="486" y2="82" stroke="#0d0d0d" stroke-width="4"/>
    <circle cx="484" cy="80" r="4.5" fill="#ff2e88" stroke-width="2.5"/>
  </g>
</svg>
