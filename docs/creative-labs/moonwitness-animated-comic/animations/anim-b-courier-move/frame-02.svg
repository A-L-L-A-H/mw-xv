<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="sky-b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d1c"/>
      <stop offset="65%" stop-color="#111a31"/>
      <stop offset="100%" stop-color="#1a2442"/>
    </linearGradient>
    <pattern id="halftone-b2" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#0d0d0d" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#sky-b2)"/>
  <circle cx="770" cy="96" r="44" fill="#f3efe4" opacity="0.9"/>
  <circle cx="788" cy="84" r="38" fill="#0d1428"/>

  <g fill="#0c1224" stroke="#0d0d0d" stroke-width="3">
    <rect x="40" y="220" width="110" height="220"/>
    <rect x="210" y="190" width="120" height="250"/>
    <rect x="610" y="180" width="130" height="260"/>
    <rect x="780" y="210" width="140" height="230"/>
  </g>
  <path d="M0 148 Q480 218 960 156" fill="none" stroke="#0d0d0d" stroke-width="3.5"/>

  <rect x="0" y="396" width="440" height="144" fill="#171d2c" stroke="#0d0d0d" stroke-width="4"/>
  <rect x="0" y="372" width="448" height="26" fill="#252d40" stroke="#0d0d0d" stroke-width="4"/>
  <rect x="720" y="408" width="240" height="132" fill="#141926" stroke="#0d0d0d" stroke-width="4"/>
  <rect x="712" y="388" width="248" height="22" fill="#21283a" stroke="#0d0d0d" stroke-width="4"/>

  <!-- Launch Dust & Speed Arcs at Parapet Edge -->
  <g stroke-linecap="round">
    <path d="M332 372 Q368 338 410 314" fill="none" stroke="#00e5ff" stroke-width="4.5" stroke-dasharray="18 10"/>
    <path d="M352 384 Q396 352 444 334" fill="none" stroke="#ff2e88" stroke-width="3.5" stroke-dasharray="14 10"/>
    <circle cx="348" cy="368" r="10" fill="#f3efe4" opacity="0.65" stroke="#0d0d0d" stroke-width="2.5"/>
    <circle cx="332" cy="376" r="7" fill="#ffe031" opacity="0.8" stroke="#0d0d0d" stroke-width="2"/>
  </g>

  <!-- KURO SIGNAL: Frame 2 - Explosive Launch Stretch (35-deg diagonal launch off rooftop parapet) -->
  <g id="kuro-launch-stretch" stroke="#0d0d0d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trailing Push-Off Leg fully extended along 35-deg line of action -->
    <path d="M402 276 L356 322 L322 362 L346 376 L378 336 L422 290 Z" fill="#1c1f26" stroke-width="4"/>
    <!-- Yellow Boot Sole kicking off ledge -->
    <path d="M312 356 L346 374 L334 394 L302 372 Z" fill="#181a20" stroke-width="4"/>
    <path d="M300 370 L336 392 L328 402 L294 378 Z" fill="#ffe031" stroke-width="4"/>

    <!-- Lead Knee Driving Upward -->
    <path d="M430 264 L486 274 L468 326 L444 316 L456 286 L418 282 Z" fill="#20232a" stroke-width="4"/>
    <path d="M442 314 L478 324 L472 346 L436 334 Z" fill="#181a20" stroke-width="4"/>
    <path d="M434 332 L474 344 L470 354 L430 342 Z" fill="#ffe031" stroke-width="4"/>

    <!-- Magenta Hip Strap trailing straight behind -->
    <path d="M404 274 Q366 298 334 312 Q342 324 354 318 Q384 304 414 282 Z" fill="#ff2e88" stroke-width="3.5"/>

    <!-- Stretched Diagonal Hoodie Torso -->
    <path d="M400 202 Q438 176 476 196 L446 282 Q410 288 386 266 Z" fill="#23262d" stroke-width="4.5"/>
    <path d="M400 202 Q438 176 476 196 L446 282 Q410 288 386 266 Z" fill="url(#halftone-b2)"/>
    <path d="M394 252 Q412 246 426 262 L444 280 L388 266 Z" fill="#ff2e88" stroke="none"/>
    <polygon points="444,212 448,222 456,214 460,222 464,212 464,228 444,228" fill="#ffe031" stroke-width="2.8"/>
    <path d="M412 198 Q442 214 470 194 Q460 176 434 178 Q414 182 412 198 Z" fill="#ff2e88" stroke-width="4"/>

    <!-- Back Arm whipped behind for momentum -->
    <path d="M408 208 L354 228 L334 256 L354 266 L372 242 L416 226 Z" fill="#23262d" stroke-width="4"/>
    <circle cx="342" cy="262" r="9" fill="#eab88e" stroke-width="3.5"/>

    <!-- Front Arm reaching forward clutching Receiver -->
    <path d="M466 202 L516 198 L534 176 L518 164 L502 182 L458 186 Z" fill="#23262d" stroke-width="4"/>
    <g transform="translate(520,144) rotate(24)">
      <rect x="0" y="0" width="32" height="44" rx="5" fill="#1b1f27" stroke="#0d0d0d" stroke-width="3.5"/>
      <rect x="5" y="6" width="22" height="14" rx="2" fill="#091322" stroke="#0d0d0d" stroke-width="2"/>
      <polyline points="7,14 12,9 17,18 22,10 25,14" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <polygon points="0,0 10,0 0,10" fill="#ffe031" stroke="#0d0d0d" stroke-width="1.8"/>
    </g>

    <!-- Head stretched forward along launch arc, hair streaming back -->
    <path d="M430 144 L402 142 L418 160 L400 174 L434 184 L496 184 Q510 162 504 138 Q494 112 464 112 Q434 114 430 144 Z" fill="#14161b" stroke-width="4.5"/>
    <path d="M452 140 Q454 180 482 186 Q504 180 508 148 Q504 126 480 126 Q454 128 452 140 Z" fill="#eab88e" stroke-width="4"/>
    <path d="M478 144 L498 148" stroke="#0d0d0d" stroke-width="3.5"/>
    <ellipse cx="490" cy="152" rx="6" ry="5" fill="#f3efe4" stroke-width="2.5"/>
    <circle cx="492" cy="152" r="3" fill="#0d0d0d"/>
    <rect x="488" y="160" width="14" height="6" rx="2" fill="#f3efe4" stroke-width="2.2"/>
    <rect x="466" y="166" width="12" height="6" rx="1.5" transform="rotate(-14 472 169)" fill="#f3efe4" stroke-width="2.2"/>
    <path d="M482 174 Q492 178 498 172" fill="none" stroke="#0d0d0d" stroke-width="2.8"/>

    <!-- Headset -->
    <circle cx="458" cy="154" r="14" fill="#2b303a" stroke-width="4"/>
    <circle cx="458" cy="154" r="8" fill="#00e5ff" stroke-width="2.5"/>
    <circle cx="458" cy="154" r="3.5" fill="#ff2e88" stroke="none"/>
    <line x1="450" y1="142" x2="424" y2="108" stroke="#0d0d0d" stroke-width="4"/>
    <circle cx="422" cy="106" r="4.5" fill="#ff2e88" stroke-width="2.5"/>
  </g>
</svg>
