  <line x1="0" y1="322" x2="960" y2="322" stroke="#0d0d0d" stroke-width="4"/>

  <ellipse cx="472" cy="482" rx="78" ry="14" fill="#070a14" opacity="0.74"/>

  <!-- KURO SIGNAL: Frame 4 - Receiver Raise (3/4 torso twist, lifts portable receiver close to eye level) -->
  <g id="kuro-receiver-raise" stroke="#0d0d0d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back Leg planted -->
    <path d="M482 338 L508 402 L516 458 L544 456 L534 398 L506 334 Z" fill="#1c1f26" stroke-width="4"/>
    <path d="M510 448 L548 448 L560 470 L506 470 Z" fill="#181a20" stroke-width="4"/>
    <path d="M504 468 L562 468 L562 480 L504 480 Z" fill="#ffe031" stroke-width="4"/>

    <!-- Front Leg stepped slightly forward -->
    <path d="M446 338 L428 402 L434 458 L464 456 L458 400 L474 338 Z" fill="#20232a" stroke-width="4"/>
    <rect x="422" y="370" width="20" height="32" rx="4" fill="#1a1d24" stroke-width="3.5"/>
    <path d="M426 448 L466 448 L474 470 L414 470 Z" fill="#181a20" stroke-width="4"/>
    <path d="M412 468 L476 468 L476 480 L412 480 Z" fill="#ffe031" stroke-width="4"/>

    <!-- Magenta Hip Strap -->
    <path d="M452 336 Q430 370 426 406 Q436 410 442 400 Q446 372 462 340 Z" fill="#ff2e88" stroke-width="3.5"/>

    <!-- 3/4 Twisted Torso leaning slightly toward receiver on left -->
    <path d="M440 232 Q478 222 512 238 L516 334 Q478 344 438 334 Z" fill="#23262d" stroke-width="4.5"/>
    <path d="M440 232 Q478 222 512 238 L516 334 Q478 344 438 334 Z" fill="url(#halftone-a4)"/>
    <path d="M440 310 Q456 298 470 314 Q484 304 496 322 L492 334 L438 332 Z" fill="#ff2e88" stroke="none"/>
    <polygon points="486,258 490,270 498,260 504,270 508,258 508,276 486,276" fill="#ffe031" stroke-width="3"/>
    <path d="M448 228 Q476 250 508 232 Q502 214 476 212 Q448 214 448 228 Z" fill="#ff2e88" stroke-width="4"/>
    <path d="M462 242 L456 286" fill="none" stroke="#ff2e88" stroke-width="4"/>
    <path d="M482 244 L480 284" fill="none" stroke="#ff2e88" stroke-width="4"/>

    <!-- Right Arm (back) lowering from headset toward balance -->
    <path d="M506 242 L546 274 L530 312 L512 302 L522 278 L496 260 Z" fill="#23262d" stroke-width="4"/>
    <circle cx="520" cy="312" r="10" fill="#eab88e" stroke-width="3.5"/>

    <!-- Head turned 3/4 left looking closely at raised receiver -->
    <rect x="466" y="208" width="16" height="22" fill="#d99e70" stroke-width="3.5"/>
    <path d="M430 166 Q418 192 434 214 L506 216 L526 196 Q530 172 516 154 Q504 122 472 120 Q434 122 430 166 Z" fill="#14161b" stroke-width="4.5"/>
    <path d="M440 162 Q440 208 468 216 Q498 212 504 170 Q500 144 472 144 Q442 146 440 162 Z" fill="#eab88e" stroke-width="4"/>
    <!-- Cyan face glow from receiver -->
    <path d="M440 162 Q440 208 468 216 L468 144 Q442 146 440 162 Z" fill="#00e5ff" opacity="0.22" stroke="none"/>
    <!-- Focused eyes looking left at receiver -->
    <ellipse cx="452" cy="176" rx="6.5" ry="7" fill="#f3efe4" stroke-width="2.8"/>
    <circle cx="449" cy="176" r="3.2" fill="#0d0d0d"/>
    <ellipse cx="478" cy="176" rx="6.5" ry="7" fill="#f3efe4" stroke-width="2.8"/>
    <circle cx="475" cy="176" r="3.2" fill="#0d0d0d"/>
    <rect x="456" y="186" width="16" height="6.5" rx="2" fill="#f3efe4" stroke-width="2.5"/>
    <rect x="478" y="192" width="12" height="6" rx="1.5" transform="rotate(12 484 195)" fill="#f3efe4" stroke-width="2.2"/>
    <path d="M458 202 Q466 200 472 203" fill="none" stroke="#0d0d0d" stroke-width="2.8"/>

    <!-- Bangs -->
    <path d="M430 164 L446 146 L450 166 L466 142 L476 168 L492 146 L498 168 L516 156 Q506 122 472 118 Q434 120 430 164 Z" fill="#0d0d0d" stroke-width="4"/>

    <!-- Headset -->
    <path d="M436 178 Q432 126 474 122 Q516 126 512 178" fill="none" stroke="#2b303a" stroke-width="9"/>
    <path d="M436 178 Q432 126 474 122 Q516 126 512 178" fill="none" stroke="#0d0d0d" stroke-width="3.5"/>
    <ellipse cx="508" cy="180" rx="12" ry="18" fill="#2b303a" stroke-width="4"/>
    <ellipse cx="509" cy="180" rx="6.5" ry="12" fill="#00e5ff" stroke-width="2.5"/>
    <ellipse cx="509" cy="180" rx="3" ry="6" fill="#ff2e88" stroke="none"/>
    <line x1="512" y1="164" x2="524" y2="116" stroke="#0d0d0d" stroke-width="4"/>
    <circle cx="524" cy="114" r="5" fill="#ff2e88" stroke-width="2.5"/>
    <path d="M500 194 Q486 206 468 206" fill="none" stroke="#0d0d0d" stroke-width="3.5"/>
    <rect x="462" y="202" width="11" height="7" rx="3" fill="#ff2e88" stroke-width="2.5"/>

    <!-- Left Arm Raised High holding Receiver at Eye Level -->
    <path d="M442 238 L392 246 L382 204 L402 198 L410 226 L448 220 Z" fill="#23262d" stroke-width="4"/>
    <path d="M380 198 Q376 184 390 182 Q402 184 402 198 Z" fill="#eab88e" stroke-width="3.5"/>
    <!-- Portable Receiver Raised with Active Cyan/Magenta Waveform -->
    <circle cx="388" cy="176" r="56" fill="url(#screen-glow-a4)" stroke="none"/>
    <g transform="translate(362,146) rotate(-10)">
      <rect x="0" y="0" width="46" height="62" rx="6" fill="#1b1f27" stroke="#0d0d0d" stroke-width="4"/>
      <rect x="6" y="8" width="34" height="24" rx="3" fill="#091322" stroke="#0d0d0d" stroke-width="2.5"/>
      <polyline points="8,20 14,12 19,28 24,10 29,24 34,15 38,20" fill="none" stroke="#00e5ff" stroke-width="2.6"/>
      <polyline points="8,22 15,26 22,14 30,27 38,18" fill="none" stroke="#ff2e88" stroke-width="2"/>
      <polygon points="0,0 14,0 0,14" fill="#ffe031" stroke="#0d0d0d" stroke-width="2"/>
      <rect x="8" y="38" width="10" height="6" rx="2" fill="#00e5ff" stroke="none"/>
      <rect x="22" y="38" width="10" height="6" rx="2" fill="#ff2e88" stroke="none"/>
      <line x1="36" y1="0" x2="42" y2="-20" stroke="#0d0d0d" stroke-width="3.5"/>
    </g>
  </g>
</svg>
