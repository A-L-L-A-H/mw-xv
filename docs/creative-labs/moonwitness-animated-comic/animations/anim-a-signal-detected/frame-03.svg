<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="sky-a3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d1c"/>
      <stop offset="65%" stop-color="#111a31"/>
      <stop offset="100%" stop-color="#1a2442"/>
    </linearGradient>
    <pattern id="halftone-a3" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#0d0d0d" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#sky-a3)"/>
  <circle cx="790" cy="108" r="46" fill="#f3efe4" opacity="0.9"/>
  <circle cx="808" cy="96" r="40" fill="#0d1428"/>

  <g fill="#0c1224" stroke="#0d0d0d" stroke-width="3">
    <rect x="20" y="210" width="95" height="220"/>
    <rect x="110" y="255" width="70" height="175"/>
    <rect x="175" y="185" width="105" height="245"/>
    <rect x="275" y="240" width="85" height="190"/>
    <rect x="595" y="220" width="95" height="210"/>
    <rect x="685" y="165" width="110" height="265"/>
    <rect x="790" y="235" width="80" height="195"/>
    <rect x="865" y="195" width="95" height="235"/>
  </g>
  <path d="M0 112 Q280 168 540 124 T960 156" fill="none" stroke="#0d0d0d" stroke-width="3.5"/>
  <rect x="0" y="388" width="960" height="152" fill="#171d2c" stroke="#0d0d0d" stroke-width="4"/>
  <rect x="0" y="388" width="960" height="152" fill="url(#halftone-a3)"/>
  <rect x="0" y="366" width="960" height="24" fill="#252d40" stroke="#0d0d0d" stroke-width="4"/>
  <line x1="0" y1="322" x2="960" y2="322" stroke="#2c354c" stroke-width="8"/>
  <line x1="0" y1="322" x2="960" y2="322" stroke="#0d0d0d" stroke-width="4"/>

  <ellipse cx="476" cy="482" rx="64" ry="12" fill="#070a14" opacity="0.68"/>

  <!-- KURO SIGNAL: Frame 3 - Whip Reaction & Overshoot (stretched upright, hair/strings flare up, hand whips to headset) -->
  <g id="kuro-whip-overshoot" stroke="#0d0d0d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stretched Legs (springing upright onto balls of feet) -->
    <path d="M476 322 L496 392 L506 452 L532 450 L520 390 L498 320 Z" fill="#1c1f26" stroke-width="4"/>
    <path d="M500 444 L536 444 L548 466 L496 466 Z" fill="#181a20" stroke-width="4"/>
    <path d="M494 464 L550 464 L550 476 L494 476 Z" fill="#ffe031" stroke-width="4"/>

    <path d="M442 322 L434 392 L438 454 L466 452 L462 392 L468 322 Z" fill="#20232a" stroke-width="4"/>
    <rect x="424" y="360" width="20" height="32" rx="4" fill="#1a1d24" stroke-width="3.5"/>
    <path d="M430 444 L468 444 L478 466 L422 466 Z" fill="#181a20" stroke-width="4"/>
    <path d="M420 464 L480 464 L480 476 L420 476 Z" fill="#ffe031" stroke-width="4"/>

    <!-- Magenta Hip Strap whipping upward -->
    <path d="M444 322 Q410 342 388 358 Q396 370 408 362 Q428 346 452 330 Z" fill="#ff2e88" stroke-width="3.5"/>

    <!-- Stretched Hoodie Torso -->
    <path d="M434 214 Q470 204 504 216 L510 318 Q472 328 430 318 Z" fill="#23262d" stroke-width="4.5"/>
    <path d="M434 214 Q470 204 504 216 L510 318 Q472 328 430 318 Z" fill="url(#halftone-a3)"/>
    <path d="M434 294 Q450 282 466 298 Q480 286 492 304 L488 318 L432 316 Z" fill="#ff2e88" stroke="none"/>
    <polygon points="480,242 484,254 492,244 498,254 502,242 502,260 480,260" fill="#ffe031" stroke-width="3"/>
    <path d="M442 212 Q470 236 500 214 Q496 196 470 194 Q444 196 442 212 Z" fill="#ff2e88" stroke-width="4"/>
    <!-- Flaring Hoodie Drawstrings (overlapping action) -->
    <path d="M456 226 Q436 254 424 274" fill="none" stroke="#ff2e88" stroke-width="4"/>
    <path d="M480 226 Q496 254 510 272" fill="none" stroke="#ff2e88" stroke-width="4"/>

    <!-- Right Arm (viewer's right) WHIPPING UP to Headset Earcup -->
    <path d="M498 220 L548 238 L534 184 L516 188 L524 218 L488 208 Z" fill="#23262d" stroke-width="4"/>
    <path d="M518 186 Q526 170 538 176 Q542 188 528 194 Z" fill="#eab88e" stroke-width="3.5"/>
    <!-- Motion Arc behind whipping arm -->
    <path d="M546 280 Q568 236 554 186" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="14 8"/>

    <!-- Left Arm lifting Receiver partway up -->
    <path d="M436 224 L394 268 L412 304 L430 294 L418 270 L446 244 Z" fill="#23262d" stroke-width="4"/>
    <path d="M404 298 Q396 312 410 318 Q422 316 424 302 Z" fill="#eab88e" stroke-width="3.5"/>
    <g transform="translate(368,284) rotate(-18)">
      <rect x="0" y="0" width="38" height="52" rx="6" fill="#1b1f27" stroke="#0d0d0d" stroke-width="3.5"/>
      <rect x="6" y="8" width="26" height="18" rx="3" fill="#0d1422" stroke="#0d0d0d" stroke-width="2.5"/>
      <polyline points="8,18 13,10 19,24 25,8 30,18" fill="none" stroke="#ff2e88" stroke-width="2.5"/>
      <polygon points="0,0 12,0 0,12" fill="#ffe031" stroke="#0d0d0d" stroke-width="2"/>
      <line x1="30" y1="0" x2="34" y2="-16" stroke="#0d0d0d" stroke-width="3"/>
    </g>

    <!-- Head Snapped Upright with Wide Surprised Eyes & Flaring Hair -->
    <rect x="462" y="190" width="16" height="22" fill="#d99e70" stroke-width="3.5"/>
    <!-- Flaring Hair Tufts -->
    <path d="M416 144 L432 132 L420 112 L448 118 L468 92 L486 116 L516 108 L508 134 L528 148 L512 178 L424 178 Z" fill="#14161b" stroke-width="4.5"/>
    <path d="M438 144 Q438 192 470 198 Q502 192 504 148 Q500 124 470 124 Q440 126 438 144 Z" fill="#eab88e" stroke-width="4"/>
    <!-- Wide Surprised Eyes -->
    <ellipse cx="456" cy="158" rx="8" ry="9" fill="#f3efe4" stroke-width="3"/>
    <circle cx="457" cy="158" r="3.5" fill="#0d0d0d"/>
    <circle cx="459" cy="155" r="1.5" fill="#f3efe4"/>
    <ellipse cx="486" cy="158" rx="8" ry="9" fill="#f3efe4" stroke-width="3"/>
    <circle cx="487" cy="158" r="3.5" fill="#0d0d0d"/>
    <circle cx="489" cy="155" r="1.5" fill="#f3efe4"/>
    <!-- Bandages & Surprised Open Mouth -->
    <rect x="463" y="168" width="18" height="7" rx="2" fill="#f3efe4" stroke-width="2.5"/>
    <rect x="444" y="174" width="13" height="6" rx="1.5" transform="rotate(-14 450 177)" fill="#f3efe4" stroke-width="2.2"/>
    <ellipse cx="472" cy="184" rx="6" ry="5" fill="#0d0d0d"/>
    <!-- Spiky Bangs -->
    <path d="M426 146 L444 126 L450 148 L468 122 L476 148 L492 126 L498 148 L514 136 Q504 108 470 104 Q432 106 426 146 Z" fill="#0d0d0d" stroke-width="4"/>

    <!-- Headset + Pulsing Antenna -->
    <path d="M430 160 Q426 108 470 104 Q514 108 510 160" fill="none" stroke="#2b303a" stroke-width="9"/>
    <path d="M430 160 Q426 108 470 104 Q514 108 510 160" fill="none" stroke="#0d0d0d" stroke-width="3.5"/>
    <ellipse cx="510" cy="162" rx="11" ry="18" fill="#2b303a" stroke-width="4"/>
    <ellipse cx="511" cy="162" rx="6.5" ry="12.5" fill="#00e5ff" stroke-width="2.5"/>
    <ellipse cx="511" cy="162" rx="3" ry="6" fill="#ff2e88" stroke="none"/>
    <line x1="514" y1="146" x2="524" y2="96" stroke="#0d0d0d" stroke-width="4"/>
    <circle cx="524" cy="94" r="5" fill="#ff2e88" stroke-width="2.5"/>
    <ellipse cx="432" cy="162" rx="10" ry="17" fill="#2b303a" stroke-width="4"/>
    <ellipse cx="431" cy="162" rx="5.5" ry="11" fill="#00e5ff" stroke-width="2.5"/>
    <path d="M434 174 Q448 188 466 188" fill="none" stroke="#0d0d0d" stroke-width="3.5"/>
    <rect x="462" y="184" width="11" height="7" rx="3" fill="#ff2e88" stroke-width="2.5"/>
  </g>

  <!-- Surprise Signal Bursts -->
  <g stroke-linecap="round">
    <line x1="538" y1="84" x2="556" y2="70" stroke="#00e5ff" stroke-width="4"/>
    <line x1="542" y1="98" x2="564" y2="96" stroke="#ff2e88" stroke-width="3.5"/>
    <line x1="536" y1="112" x2="554" y2="118" stroke="#00e5ff" stroke-width="3.5"/>
  </g>
</svg>
