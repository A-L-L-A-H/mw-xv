<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <pattern id="halftone-prop3" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#0d0d0d" opacity="0.24"/>
    </pattern>
  </defs>

  <!-- Dark Archive Desk Surface -->
  <rect width="960" height="540" fill="#111626"/>
  <rect width="960" height="540" fill="url(#halftone-prop3)"/>

  <!-- Tactile MoonWitness Zine Dossier Folder -->
  <g transform="translate(174,62)" stroke="#0d0d0d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Drop Shadow -->
    <rect x="16" y="18" width="612" height="416" rx="12" fill="#060810" opacity="0.72" stroke="none"/>

    <!-- Back Folder Tab -->
    <path d="M0 32 L0 12 Q0 0 14 0 L196 0 Q212 0 220 14 L236 36 L612 36 L612 416 L0 416 Z" fill="#232836" stroke-width="5"/>

    <!-- Front Sealed Folio Cover with Intact Void-Marker Notch on Right Edge -->
    <path d="M0 44 L612 44 L612 186 L584 214 L612 242 L612 416 L0 416 Z" fill="#2d3446" stroke-width="5"/>
    <path d="M0 44 L612 44 L612 186 L584 214 L612 242 L612 416 L0 416 Z" fill="url(#halftone-prop3)"/>

    <!-- Crescent Moon Witness Emblem Embossed on Cover -->
    <circle cx="152" cy="170" r="54" fill="#181d2b" stroke-width="4.5"/>
    <circle cx="152" cy="170" r="32" fill="#f3efe4" stroke="none"/>
    <circle cx="166" cy="160" r="28" fill="#181d2b" stroke="none"/>

    <!-- Cream Label Patch (non-verbal redaction bars only) -->
    <rect x="242" y="122" width="290" height="96" rx="6" fill="#f3efe4" stroke-width="4"/>
    <rect x="266" y="144" width="180" height="16" rx="3" fill="#1b1f27" stroke="none"/>
    <rect x="266" y="174" width="234" height="16" rx="3" fill="#00b8f0" stroke="none"/>

    <!-- Intact Void-Marker Notch Accent -->
    <polygon points="584,214 612,186 612,242" fill="#00e5ff" opacity="0.28" stroke="#00e5ff" stroke-width="3"/>

    <!-- Magenta Gaffer X-Tape Sealing the Folio -->
    <polygon points="150,248 486,368 470,404 134,284" fill="#ff2e88" stroke-width="4.5"/>
    <polygon points="470,248 134,368 150,404 486,284" fill="#ff2e88" stroke-width="4.5"/>

    <!-- Two Yellow Binder Clips Clamping the Top Edge -->
    <g>
      <rect x="318" y="14" width="60" height="44" rx="6" fill="#ffe031" stroke-width="4.5"/>
      <path d="M330 14 Q348 -20 366 14" fill="none" stroke="#c7d0e2" stroke-width="5"/>
      <rect x="468" y="14" width="60" height="44" rx="6" fill="#ffe031" stroke-width="4.5"/>
      <path d="M480 14 Q498 -20 516 14" fill="none" stroke="#c7d0e2" stroke-width="5"/>
    </g>
  </g>
</svg>
