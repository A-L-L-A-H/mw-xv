<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg-prop1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d1c"/>
      <stop offset="60%" stop-color="#111a31"/>
      <stop offset="100%" stop-color="#1c1630"/>
    </linearGradient>
    <radialGradient id="led-glow-prop1" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.48"/>
      <stop offset="60%" stop-color="#ff2e88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="halftone-prop1" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.2" fill="#0d0d0d" opacity="0.34"/>
    </pattern>
  </defs>

  <!-- Night Comic Halftone Backdrop -->
  <rect width="960" height="540" fill="url(#bg-prop1)"/>
  <rect x="0" y="0" width="170" height="540" fill="url(#halftone-prop1)"/>
  <rect x="790" y="0" width="170" height="540" fill="url(#halftone-prop1)"/>
  <circle cx="480" cy="240" r="230" fill="url(#led-glow-prop1)"/>

  <!-- Dynamic Speed Lines Radiating From Receiver -->
  <g stroke="#00e5ff" stroke-width="2.5" opacity="0.28" stroke-linecap="round">
    <line x1="120" y1="90" x2="290" y2="180"/>
    <line x1="840" y1="95" x2="670" y2="185"/>
    <line x1="90" y1="360" x2="270" y2="300"/>
    <line x1="870" y1="365" x2="690" y2="305"/>
  </g>

  <!-- Kuro's Forearm & Oversized Charcoal Hoodie Cuff -->
  <g stroke="#0d0d0d" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 540 L264 384 L388 432 L344 540 Z" fill="#23262d" stroke-width="5"/>
    <path d="M236 456 Q274 438 302 468 Q322 454 344 484 L328 540 L218 540 Z" fill="#ff2e88" stroke="none"/>
    <!-- Bare Hand Gripping Portable Receiver -->
    <path d="M286 382 Q302 332 346 318 L368 352 L352 426 L296 418 Z" fill="#eab88e" stroke-width="4.5"/>
    <!-- Fingers Wrapping Around Right Edge -->
    <rect x="614" y="256" width="54" height="36" rx="16" fill="#eab88e" stroke-width="4.5"/>
    <rect x="616" y="300" width="58" height="36" rx="16" fill="#eab88e" stroke-width="4.5"/>
    <rect x="610" y="344" width="52" height="34" rx="15" fill="#eab88e" stroke-width="4.5"/>
  </g>

  <!-- Matte Charcoal Portable Receiver Close-Up -->
  <g transform="translate(332,96)" stroke="#0d0d0d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stubby Aerial -->
    <rect x="234" y="-68" width="16" height="76" rx="6" fill="#2b303a" stroke-width="4.5"/>
    <circle cx="242" cy="-70" r="11" fill="#ff2e88" stroke-width="4"/>
    <circle cx="242" cy="-70" r="24" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="10 8"/>
    <circle cx="242" cy="-70" r="42" fill="none" stroke="#ff2e88" stroke-width="2.5" opacity="0.7" stroke-dasharray="14 10"/>

    <!-- Main Matte Charcoal Chassis -->
    <rect x="0" y="0" width="296" height="378" rx="22" fill="#1b1f27" stroke-width="5.5"/>
    <rect x="14" y="14" width="268" height="350" rx="14" fill="#222732" stroke-width="3"/>

    <!-- Yellow Corner Tape -->
    <polygon points="-4,26 56,-4 86,-4 -4,56" fill="#ffe031" stroke-width="3.5"/>
    <polygon points="222,382 300,334 300,364 252,382" fill="#ffe031" stroke-width="3.5"/>

    <!-- Waveform LED Screen -->
    <rect x="30" y="36" width="236" height="154" rx="10" fill="#081120" stroke-width="4.5"/>
    <!-- Subtle Grid Lines -->
    <g stroke="#00b8f0" stroke-width="1" opacity="0.24">
      <line x1="34" y1="74" x2="262" y2="74"/>
      <line x1="34" y1="112" x2="262" y2="112"/>
      <line x1="34" y1="150" x2="262" y2="150"/>
      <line x1="90" y1="40" x2="90" y2="186"/>
      <line x1="148" y1="40" x2="148" y2="186"/>
      <line x1="206" y1="40" x2="206" y2="186"/>
    </g>
    <!-- Glowing Cyan & Magenta Waveform Spike -->
    <polyline points="42,114 70,114 88,68 108,158 132,52 154,166 178,76 200,136 220,104 254,114" fill="none" stroke="#00e5ff" stroke-width="5.5"/>
    <polyline points="42,118 76,128 102,88 128,144 156,74 184,148 212,96 254,118" fill="none" stroke="#ff2e88" stroke-width="3.5"/>

    <!-- Non-Verbal HUD LED Bars -->
    <rect x="32" y="212" width="44" height="16" rx="4" fill="#00e5ff" stroke-width="3"/>
    <rect x="88" y="212" width="44" height="16" rx="4" fill="#00e5ff" stroke-width="3"/>
    <rect x="144" y="212" width="44" height="16" rx="4" fill="#ffe031" stroke-width="3"/>
    <rect x="200" y="212" width="64" height="16" rx="4" fill="#ff2e88" stroke-width="3"/>

    <!-- Tactile Dials & Speaker Grille -->
    <circle cx="76" cy="290" r="34" fill="#161a22" stroke-width="4.5"/>
    <line x1="76" y1="290" x2="96" y2="270" stroke="#ffe031" stroke-width="5"/>
    <g fill="#0d0d0d">
      <rect x="144" y="264" width="116" height="8" rx="4"/>
      <rect x="144" y="284" width="116" height="8" rx="4"/>
      <rect x="144" y="304" width="116" height="8" rx="4"/>
      <rect x="144" y="324" width="84" height="8" rx="4"/>
    </g>
  </g>

  <!-- Thumb Pressing Left Side of Receiver -->
  <path d="M312 316 Q356 298 378 326 Q384 352 346 364 L306 356 Z" fill="#eab88e" stroke="#0d0d0d" stroke-width="4.5" stroke-linejoin="round"/>
</svg>
