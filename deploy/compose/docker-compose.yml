# Local base stack. Run from the repository root with
#   docker compose -f deploy/compose/docker-compose.yml up -d postgres
# Standalone WhatsApp, ISP/RADIUS, and Control Plane services were extracted to sibling repositories
# tracked in the workspace manifest (workspace.json).
services:
  postgres:
    image: postgres:16-alpine
    container_name: moonwitness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: moonwitness_db
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d moonwitness_db]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
