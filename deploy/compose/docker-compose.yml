services:
  postgres:
    image: postgres:16-alpine
    container_name: moonwitness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moonwitness_db
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d moonwitness_db]
      interval: 5s
      timeout: 5s
      retries: 10

  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.6.0
    container_name: moonwitness_gowa
    restart: unless-stopped
    command: ['rest', '--basic-auth=moonwitness:moonwitness', '--port=3000']
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - gowa_data:/app/storages

  radius:
    build:
      context: .
      dockerfile: apps/isp/Dockerfile
    container_name: moonwitness_isp
    restart: unless-stopped
    ports:
      - '1812:1812/udp'
      - '1813:1813/udp'
      - '127.0.0.1:3002:3000'
    environment:
      - MW_ISP_DB_PATH=/data/isp.db
      - MW_ISP_RADIUS_SECRET=testing123
      - MW_INTERNAL_SECRET=${MW_INTERNAL_SECRET:-${JWT_SECRET:-}}
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - isp_data:/data

  control-plane:
    build:
      context: ./apps/control-plane
      dockerfile: Dockerfile
    container_name: moonwitness-control-plane
    restart: unless-stopped
    ports:
      - '127.0.0.1:3003:3003'
    environment:
      - MW_CONTROL_PLANE_ADDR=0.0.0.0:3003
      - MW_CONTROL_PLANE_DB_PATH=/data/control-plane.db
      - MW_INTERNAL_SECRET=${MW_INTERNAL_SECRET:-${JWT_SECRET:-}}
      - DOCKER_BIN=docker
    # The Docker socket is intentionally not mounted: it grants host-root equivalent access.
    # Opt in explicitly with:
    #   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.docker-socket.yml \
    #     --profile docker-in-docker up control-plane-docker
    volumes:
      - control-plane_data:/data
    depends_on:
      - postgres
      - gowa
      - radius

volumes:
  pgdata:
  gowa_data:
  isp_data:
  control-plane_data:
