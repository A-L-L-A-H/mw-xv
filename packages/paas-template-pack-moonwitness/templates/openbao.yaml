# OpenBao (fork Vault, Linux Foundation) — secrets management & PKI.
# Infrastruktur secrets untuk orm-compliance / sovereign data infra.
services:
  openbao:
    image: openbao/openbao:latest
    expose:
      - '8200'
    environment:
      - BAO_ADDR=http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - openbao-data:/openbao/file
    entrypoint: ['bao', 'server', '-dev', '-dev-root-token-id=${SERVICE_PASSWORD_ROOT}']
volumes:
  openbao-data:
